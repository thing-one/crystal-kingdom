  function decorCliffs() {
    let s = islandBase(156, '#8d7ac9', '#5a4a8f');
    s += '<path d="M-58 -2 L-26 -58 L4 -2 Z" fill="#9b8ad4"/>';
    s += '<path d="M-38 -36 L-26 -58 L-14 -36 L-20 -30 L-26 -38 L-32 -30 Z" fill="#f3f0ff"/>';
    s += '<path d="M-14 -2 L26 -76 L62 -2 Z" fill="#b3a4e8"/>';
    s += '<path d="M12 -50 L26 -76 L40 -50 L32 -42 L26 -52 L20 -42 Z" fill="#ffffff"/>';
    s += '<g class="wm-facet"><circle cx="-40" cy="-78" r="5" fill="#ffd166"/>' +
      '<path d="M-40 -78 Q-18 -88 6 -96" fill="none" stroke="#ffe9a8" stroke-width="3" stroke-linecap="round" opacity="0.8"/></g>';
    s += '<circle class="wm-snow" cx="-2" cy="-44" r="2.4" fill="#ffe9a8"/>';

  function decorMaze() {

      ' Q' + (x - w / 2) + ' ' + -h + ' ' + x + ' ' + -h +
      ' Q' + (x + w / 2) + ' ' + -h + ' ' + (x + w / 2) + ' ' + (-h + w / 2) +
      ' L' + (x + w / 2) + ' -4 Z" fill="' + c + '"/>' +
      '<path class="wm-facet ' + cls + '" d="M' + (x - w / 4) + ' -4 L' + (x - w / 4) + ' ' + (-h + 6) +
      ' L' + (x + w / 8) + ' ' + (-h + 10) + ' L' + (x + w / 8) + ' -4 Z" fill="#f4f1ff" opacity="0.55"/>';
    s += arch(-36, 46, 24, '#d9b8f5', '');
    s += arch(0, 64, 28, '#ecd2ff', 'f2');
    s += arch(36, 42, 22, '#cfa6ef', 'f3');
    s += '<circle cx="0" cy="-72" r="3.5" fill="#7ef0e2"/>';
    return s;
  }

  function decorLighthouse() {
    let s = '<ellipse class="wm-halo" cx="0" cy="-58" rx="78" ry="54" fill="#ffd166" opacity="0.2"/>';
    s += islandBase(146, '#3a6fa8', '#2d4a78');
    s += '<path d="M-14 -4 L-9 -64 L9 -64 L14 -4 Z" fill="#f3f0ff"/>';
    s += '<path d="M-12 -18 L12 -18 L13 -8 L-13 -8 Z" fill="#ff8e7a"/>';
    s += '<path d="M-10 -44 L10 -44 L11 -32 L-11 -32 Z" fill="#ff8e7a"/>';
    s += '<rect x="-8" y="-76" width="16" height="12" rx="3" fill="#33254f"/>';
    s += '<circle class="wm-facet" cx="0" cy="-70" r="5" fill="#ffd166"/>';
    s += '<path class="wm-facet f2" d="M6 -74 L54 -86 L54 -56 Z" fill="#ffe9a8" opacity="0.4"/>';
    s += '<path class="wm-facet f3" d="M-6 -74 L-54 -86 L-54 -56 Z" fill="#ffe9a8" opacity="0.35"/>';
    s += '<circle cx="-30" cy="-20" r="2.4" fill="#fff7df"/><circle cx="32" cy="-26" r="2.2" fill="#fff7df"/>';
    return s;
  }

  function decorStarcastle() {
    let s = '<ellipse class="wm-halo" cx="0" cy="-44" rx="96" ry="66" fill="#ffd166" opacity="0.22"/>';
    s += islandBase(190, '#f2d98c', '#8f6fb0');
    const tower = (x, h, w, c, cls) =>
      '<rect x="' + (x - w / 2) + '" y="' + -h + '" width="' + w + '" height="' + (h - 4) + '" rx="4" fill="' + c + '"/>' +
      '<path d="M' + (x - w / 2 - 3) + ' ' + -h + ' L' + x + ' ' + (-h - 20) + ' L' + (x + w / 2 + 3) + ' ' + -h + ' Z" fill="#f0abfc"/>' +
      '<path class="wm-facet ' + cls + '" d="M' + x + ' ' + (-h - 20) + ' L' + x + ' ' + -h + ' L' + (x + w / 2 + 3) + ' ' + -h + ' Z" fill="#fff7df" opacity="0.65"/>';
    s += tower(-46, 56, 22, '#ffe9a8', '');
    s += tower(46, 56, 22, '#ffe9a8', 'f3');
    s += tower(0, 84, 34, '#fff3c4', 'f2');
    s += '<rect x="-10" y="-34" width="20" height="28" rx="9" fill="#33254f" opacity="0.55"/>';
    s += '<polygon points="' + starPts(0, -116, 12) + '" fill="#ffd166" stroke="#fff3c4" stroke-width="2"/>';
    return s;
  }

  const DECOR = {
    woods: decorWoods,
    reef: decorReef,
    mountains: decorMountains,
    palace: decorPalace,
    summit: decorSummit,
    castle: decorCastle,
    grove: decorGrove,
    lagoon: decorLagoon,
    cliffs: decorCliffs,
    maze: decorMaze,
    lighthouse: decorLighthouse,
    starcastle: decorStarcastle,
  };

  // The travel balloon floats in the open sky, top-left, clear of every land.
  function balloonGroup() {
    return (
      '<g class="wm-balloon" data-balloon role="button" aria-label="Fly to the other kingdom" transform="translate(84 132)">' +
      '<g class="wm-float">' +
      '<path d="M0 -74 Q-30 -74 -30 -44 Q-30 -20 -12 -8 L12 -8 Q30 -20 30 -44 Q30 -74 0 -74 Z" fill="#ff8e7a"/>' +
      '<path d="M0 -74 Q-12 -74 -12 -44 Q-12 -18 -6 -8 L6 -8 Q12 -18 12 -44 Q12 -74 0 -74 Z" fill="#ffd166"/>' +
      '<line x1="-10" y1="-8" x2="-7" y2="8" stroke="#8c6b33" stroke-width="2"/>' +
      '<line x1="10" y1="-8" x2="7" y2="8" stroke="#8c6b33" stroke-width="2"/>' +
      '<rect x="-10" y="8" width="20" height="14" rx="4" fill="#a05c2c"/>' +
      '<rect x="-10" y="8" width="20" height="5" rx="2.5" fill="#c47a3f"/>' +
      '</g>' +
      '<text class="wm-name" x="0" y="48" text-anchor="middle" font-size="17" fill="#f7f5ff" stroke="#12103a" stroke-width="4" paint-order="stroke">Fly!</text>' +
      '<rect x="-52" y="-96" width="104" height="150" fill="none" pointer-events="all"/>' +
      '</g>'
    );
  }

  function lockIcon() {
    return (
      '<g class="wm-lock" transform="translate(0 -36)">' +
      '<path d="M-10 -4 L-10 -12 Q-10 -24 0 -24 Q10 -24 10 -12 L10 -4" fill="none" stroke="#dcd6ff" stroke-width="5" stroke-linecap="round"/>' +
      '<path d="M-16 -4 L16 -4 L12 22 L0 28 L-12 22 Z" fill="#bfb6ea"/>' +
      '<path d="M0 -4 L16 -4 L12 22 L0 28 Z" fill="#9d92d4"/>' +
      '<circle cx="0" cy="9" r="4.5" fill="#4d4880"/>' +
      '</g>'
    );
  }

  function starsRow(stars) {
    let s = '<g transform="translate(0 30)">';
    for (let i = 0; i < 3; i++) {
      const x = (i - 1) * 24;
      const lit = i < stars;
      s += '<polygon points="' + starPts(x, 0, 10) + '" fill="' + (lit ? '#ffd166' : 'rgba(247,245,255,0.22)') + '"' +
        (lit ? ' stroke="#fff3c4" stroke-width="1"' : '') + '/>';
    }
    return s + '</g>';
  }

  function landGroup(land, isNext) {
    const spot = SPOTS[land.id];
    if (!spot) return '';
    const state = land.stars > 0 ? 'done' : land.unlocked ? 'open' : 'locked';
    const decor = DECOR[land.id] ? DECOR[land.id]() : '';
    const big = land.id === 'castle' || land.id === 'starcastle';
    return (
      '<g class="wm-land' + (isNext ? ' wm-next' : '') + '" data-land="' + land.id + '" data-state="' + state +
      '" role="button" aria-label="' + land.name + '" transform="translate(' + spot.x + ' ' + spot.y + ')">' +
      '<ellipse class="wm-ring" cx="0" cy="-10" rx="' + (big ? 112 : 92) + '" ry="' + (big ? 84 : 70) +
      '" fill="none" stroke="#ffd166" stroke-width="4" opacity="0"/>' +
      (state === 'done' ? '<ellipse class="wm-doneglow" cx="0" cy="-16" rx="' + (big ? 104 : 84) + '" ry="' + (big ? 74 : 60) + '" fill="#ffd166" opacity="0.35"/>' : '') +
      '<g class="wm-float">' + decor +
      (state === 'locked' ? lockIcon() : '') +
      starsRow(land.stars) +
      '<text class="wm-name" x="0" y="62" text-anchor="middle" font-size="' + (big ? 24 : 21) +
      '" fill="#f7f5ff" stroke="#12103a" stroke-width="4" paint-order="stroke">' + land.name + '</text>' +
      '</g>' +
      '<rect x="' + (big ? -120 : -100) + '" y="' + (big ? -150 : -130) + '" width="' + (big ? 240 : 200) +
      '" height="' + (big ? 240 : 210) + '" fill="none" pointer-events="all"/>' +
      '</g>'
    );
  }

  function skyBits() {
    let s = '';
    const seeds = [37, 91, 153, 222, 318, 411, 489, 566, 648, 731, 808, 877, 944, 263, 692];
    for (let i = 0; i < seeds.length; i++) {
      const x = seeds[i];
      const y = 24 + ((x * 7919) % 230);
      const r = 1.2 + ((x * 31) % 10) / 6;
      s += '<circle class="wm-skystar" cx="' + x + '" cy="' + y + '" r="' + r.toFixed(1) +
        '" fill="#f7f5ff" style="animation-delay:' + (-(x % 24) / 10) + 's"/>';
    }
    s += '<path class="wm-aurora" d="M-20 120 Q180 40 420 96 Q700 160 1020 70 L1020 10 Q660 96 380 44 Q160 4 -20 60 Z" fill="#7ef0e2" opacity="0.35"/>';
    s += '<path class="wm-aurora" style="animation-delay:-4.5s" d="M-20 170 Q240 90 520 140 Q780 186 1020 120 L1020 86 Q760 150 520 108 Q260 64 -20 130 Z" fill="#c4b5fd" opacity="0.3"/>';
    const cloud = (cls, y, sc) =>
      '<g class="wm-cloud ' + cls + '" opacity="0.5" transform="translate(0 ' + y + ') scale(' + sc + ')">' +
      '<ellipse cx="0" cy="0" rx="46" ry="16" fill="#f7f5ff" opacity="0.5"/>' +
      '<ellipse cx="-26" cy="6" rx="28" ry="11" fill="#f7f5ff" opacity="0.4"/>' +
      '<ellipse cx="30" cy="7" rx="26" ry="10" fill="#f7f5ff" opacity="0.4"/></g>';
    s += cloud('', 96, 1) + cloud('c2', 200, 0.8) + cloud('c3', 58, 0.6);
    return s;
  }

  function windingPath(order) {
    let d = '';
    for (let i = 0; i < order.length; i++) {
      const p = SPOTS[order[i]];
      if (i === 0) {
        d = 'M' + p.x + ' ' + p.y;
      } else {
        const prev = SPOTS[order[i - 1]];
        const mx = (prev.x + p.x) / 2;
        const my = Math.min(prev.y, p.y) - 46;
        d += ' Q' + mx + ' ' + my + ' ' + p.x + ' ' + p.y;
      }
    }
    return '<path class="wm-path" d="' + d + '" fill="none" stroke="#f7f5ff" stroke-width="5" stroke-linecap="round" opacity="0.45"/>';
  }

  function render(container, view, onSelectLand, onTravel) {
    const ramp = view.world === 2 ? SKY2 : SKY;
    const warmth = Math.max(0, Math.min(ramp.length - 1, view.completedCount | 0));
    const sky = ramp[warmth];
    container.style.background =
      'linear-gradient(180deg, ' + sky[0] + ' 0%, ' + sky[1] + ' 52%, ' + sky[2] + ' 100%)';

    let svg = '<svg viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" aria-label="Kingdom map">';
    svg += skyBits();
    svg += windingPath(view.world === 2 ? W2_ORDER : W1_ORDER);
    for (const land of view.lands) {
      svg += landGroup(land, view.highlight === land.id);
    }
    if (view.travel) svg += balloonGroup();
    svg += '</svg>';
    container.innerHTML = svg;

    container.onclick = (e) => {
      const t = e.target;
      const b = t && t.closest ? t.closest('[data-balloon]') : null;
      if (b) {
        if (onTravel) onTravel();
        return;
      }
      const g = t && t.closest ? t.closest('.wm-land') : null;
      if (g && onSelectLand) onSelectLand(g.getAttribute('data-land'));
    };
  }

  return { render };
})();

// === src/ui/avatar.js ===
// Avatar — SVG gymnast with ponytail and gradient leotard.
// Avatar.mount(el) injects the rig; Avatar.trick(streakN) plays a CSS-keyframe
// trick that varies with streak length; Avatar.idle() returns to the idle bob.
// Reduced motion: CSS swaps every trick for a gentle bounce (styles.css).
// Note: SVG paint-server references are not allowed by the build rules, so the
// leotard "gradient" is layered solid fills (violet -> sea -> teal).

const Avatar = (() => {
  let rigEl = null;
  let hostEl = null;
  let trickTimer = 0;

  const TRICKS = ['av-cartwheel', 'av-flip', 'av-stuck'];
  const TRICK_MS = { 'av-cartwheel': 1050, 'av-flip': 1100, 'av-stuck': 1400 };

  const SVG = [
    '<svg viewBox="0 0 120 170" role="img" aria-label="Charlie the gymnast">',
    '<g class="av-rig av-idle">',
    // ponytail (behind the head, swings)
    '<g class="av-pony">',
    '<path d="M76 26 Q98 30 96 56 Q94 74 84 80 Q90 60 80 46 Q74 36 72 32 Z" fill="#6b4226"/>',

    '<circle cx="54" cy="34" r="2.4" fill="#33254f"/>',

    '<path d="M53 42 Q60 48 67 42" fill="none" stroke="#b3604a" stroke-width="2.6" stroke-linecap="round"/>',
    '<circle cx="49" cy="40" r="3" fill="#ff8e7a" opacity="0.55"/>',
    '<circle cx="71" cy="40" r="3" fill="#ff8e7a" opacity="0.55"/>',
    // arms raised in a V (gymnast salute)
    '<path d="M46 62 Q32 50 26 34" fill="none" stroke="#f2c39b" stroke-width="8" stroke-linecap="round"/>',
    '<path d="M74 62 Q88 50 94 34" fill="none" stroke="#f2c39b" stroke-width="8" stroke-linecap="round"/>',
    // leotard torso — layered fills fake a violet-to-teal gradient
    '<path d="M46 56 Q60 50 74 56 L78 92 Q60 102 42 92 Z" fill="#8b5cf6"/>',
    '<path d="M44.5 74 Q60 70 75.5 74 L78 92 Q60 102 42 92 Z" fill="#56a8d6" opacity="0.85"/>',
    '<path d="M43.4 84 Q60 80 76.7 84 L78 92 Q60 102 42 92 Z" fill="#2dd4bf" opacity="0.95"/>',
    // legs
    '<path d="M50 96 L46 140" fill="none" stroke="#f2c39b" stroke-width="9" stroke-linecap="round"/>',
    '<path d="M70 96 L74 140" fill="none" stroke="#f2c39b" stroke-width="9" stroke-linecap="round"/>',
    // slippers
    '<ellipse cx="45" cy="145" rx="8" ry="4.5" fill="#a78bfa"/>',
    '<ellipse cx="75" cy="145" rx="8" ry="4.5" fill="#a78bfa"/>',
    // leotard sparkles
    '<circle cx="55" cy="66" r="2" fill="#ffe9a8"/>',
    '<circle cx="66" cy="78" r="1.7" fill="#ffe9a8"/>',
    '<circle cx="60" cy="88" r="1.4" fill="#f7f5ff"/>',
    '</g>',
    '</svg>',
  ].join('');

  function mount(el) {
    if (!el) return;
    hostEl = el;
    el.classList.add('avatar');
    el.innerHTML = SVG;
    rigEl = el.querySelector('.av-rig');
    idle();
  }

  function clearTricks() {
    if (!rigEl) return;
    for (const t of TRICKS) rigEl.classList.remove(t);
  }

  function idle() {
    if (!rigEl) return;
    if (trickTimer) {
      clearTimeout(trickTimer);
      trickTimer = 0;
    }
    clearTricks();
    rigEl.classList.add('av-idle');
  }

  // streakN: current first-try streak. 1 → cartwheel, 2 → flip, 3+ → stuck landing.
  function trick(streakN) {
    if (!rigEl) return;
    const n = Math.max(1, streakN | 0);
    const name = n >= 3 ? 'av-stuck' : TRICKS[(n - 1) % 2];
    if (trickTimer) clearTimeout(trickTimer);
    clearTricks();
    rigEl.classList.remove('av-idle');
    // force a reflow so re-triggering the same trick restarts the animation
    void rigEl.getBoundingClientRect();
    rigEl.classList.add(name);
    trickTimer = setTimeout(idle, TRICK_MS[name] || 1200);
  }

  // helper for main.js: screen-space center of the avatar (sparkle trail origin)
  function center() {
    if (!hostEl) return null;
    const r = hostEl.getBoundingClientRect();
    if (!r.width) return null;
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  return { mount, trick, idle, center };
})();

// === src/ui/screens.js ===
// Screens — innerHTML template renderers + small DOM helpers for every screen.
// main.js owns routing and delegated events; everything here only paints.


const Screens = (() => {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '"' ? '&quot;' : '&#39;'
    );
  }

  // ---------- title ----------
  function title(el) {
    el.innerHTML =
      '<section class="screen screen-title">' +
      '<div class="title-gem">💎</div>' +
      '<h1 class="game-title"><span><span class="title-spark">✦</span> Charlie&#39;s <span class="title-spark">✦</span></span>' +
      '<span class="grad">Crystal Kingdom</span></h1>' +
      '<p class="title-sub">A tumbling quest through two floating kingdoms</p>' +
      '<button class="btn btn-play" data-action="play" data-press>Play</button>' +
      '</section>';
  }

  // ---------- map shell (WorldMap paints into [data-worldmap]) ----------
  function map(el, opts) {
    const o = opts || {};
    const title = o.title || 'Charlie&#39;s Crystal Kingdom';
    const travel = o.travel
      ? '<button class="btn btn-ghost btn-travel" data-action="travel" data-press>' + o.travel + '</button>'
      : '';
    el.innerHTML =
      '<section class="screen screen-map">' +
      '<div class="map-stage" data-worldmap></div>' +
      '<header class="map-top">' +
      '<h1 class="map-title">' + title + '</h1>' +
      '<div class="map-actions">' +
      travel +
      '<button class="btn btn-ghost" data-action="friends" data-press>🦊 Friends</button>' +
      '<button class="btn btn-ghost" data-action="settings" data-press aria-label="Settings">⚙️</button>' +
      '</div></header>' +
      '</section>';
  }

  // ---------- challenge ----------
  function dotsHtml(cur, ctx) {
    // Render the dot row from ORIGINAL challenge counts so a requeued item
    // never grows the row (the finish line must never move away after a miss)
    // and the egg markers stay pinned to original challenges 3 and 6.
    // A requeued item simply shows as the current dot.
    const hasOriginals =
      cur.phase === 'challenge' &&
      typeof cur.originalsTotal === 'number' &&
      typeof cur.originalsDone === 'number';
    const total = hasOriginals ? cur.originalsTotal : cur.total;
    const nowAt = hasOriginals ? Math.min(cur.originalsDone + 1, total) : cur.index;
    let s = '<div class="dots" aria-hidden="true">';
    for (let i = 1; i <= total; i++) {
      let cls = 'dot';
      if (i < nowAt) cls += ' done';
      else if (i === nowAt) cls += ' now';
      if (cur.phase === 'challenge' && !ctx.isFinale && (i === 3 || i === 6)) cls += ' dot-egg';
      s += '<span class="' + cls + '"></span>';
    }
    return s + '</div>';
  }

  function golemSvg() {
    return (
      '<svg viewBox="0 0 100 100" aria-label="Crystal golem">' +
      '<g class="golem-rig">' +
      '<path d="M50 14 L62 30 L56 34 L50 24 L44 34 L38 30 Z" fill="#7ef0e2"/>' +
      '<path d="M20 86 Q12 56 30 42 Q40 30 50 30 Q60 30 70 42 Q88 56 80 86 Z" fill="#6f6a9c"/>' +
      '<path d="M50 30 Q60 30 70 42 Q88 56 80 86 L50 86 Z" fill="#5d5890"/>' +
      '<path d="M14 56 L26 44 L32 58 L22 66 Z" fill="#b9a7ff"/>' +
      '<path d="M86 56 L74 44 L68 58 L78 66 Z" fill="#b9a7ff"/>' +
      '<path d="M30 50 L40 46 L38 56 Z" fill="#7ef0e2" opacity="0.85"/>' +
      '<path d="M70 50 L60 46 L62 56 Z" fill="#7ef0e2" opacity="0.85"/>' +
      // grumpy brows + eyes + frown
      '<path d="M34 56 L46 60" stroke="#241f52" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M66 56 L54 60" stroke="#241f52" stroke-width="4" stroke-linecap="round"/>' +
      '<circle cx="41" cy="66" r="3.4" fill="#241f52"/>' +
      '<circle cx="59" cy="66" r="3.4" fill="#241f52"/>' +
      '<path d="M42 78 Q50 73 58 78" fill="none" stroke="#241f52" stroke-width="3.6" stroke-linecap="round"/>' +
      '</g></svg>'
    );
  }

  function bossBarHtml(cur, ctx) {
    let segs = '';
    for (let i = 0; i < cur.bossTotal; i++) {
      segs += '<div class="shell-seg' + (i < ctx.bossHits ? ' cracked' : '') + '" data-seg="' + i + '"></div>';
    }
    return (
      '<div class="boss-bar">' +
      '<div class="golem" data-golem>' + golemSvg() + '</div>' +
      '<div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0">' +
      '<div class="boss-name">' + esc(ctx.bossName || 'The Crystal Golem') + '</div>' +
      '<div class="shell" data-shell>' + segs + '</div>' +
      '</div></div>'
    );
  }

  function tilesHtml(item) {
    let slots = '';
    for (let i = 0; i < item.word.length; i++) {
      slots += '<span class="slot" data-slot="' + i + '"></span>';
    }
    let bank = '';
    for (let i = 0; i < item.tiles.length; i++) {
      bank +=
        '<button class="tile" data-press data-tile="' + esc(item.tiles[i]) + '" data-ti="' + i + '">' +
        esc(item.tiles[i]) + '</button>';
    }
    bank += '<button class="tile tile-back" data-press data-action="backspace" aria-label="Take a letter back">⌫</button>';
    return (
      '<div class="word-clue"><span class="clue-emoji">' + esc(item.emoji || '✨') + '</span>' +
      '<span class="clue-text">' + esc(item.clue || '') + '</span></div>' +
      '<div class="slots" data-slots>' + slots + '</div>' +
      '<div class="tile-bank" data-bank>' + bank + '</div>'
    );
  }

  function choicesHtml(item) {
    const multi = Array.isArray(item.answerIndices);
    let cls = 'choices';
    if (item.bigChoices) cls += ' big';
    if (item.choices.length === 3) cls += ' n3';
    let s = '<div class="' + cls + '" data-choices' + (multi ? ' data-multi="2"' : '') + '>';
    for (let i = 0; i < item.choices.length; i++) {
      s += '<button class="choice" data-press data-choice="' + i + '">' + esc(item.choices[i]) + '</button>';
    }
    return s + '</div>';
  }

  function challenge(el, cur, ctx) {
    const item = cur.item;
    const isBoss = cur.phase === 'boss';
    el.innerHTML =
      '<section class="screen screen-challenge">' +
      '<header class="ch-top">' +
      '<button class="btn btn-ghost" data-action="back-map" data-press>🗺️ Map</button>' +
      dotsHtml(cur, ctx) +
      '<span class="ch-top-right">' +
      '<button class="btn btn-ghost" data-action="toggle-mute" data-press data-mute-icon aria-label="Sound on or off">' +
      muteIcon(ctx.muted) + '</button>' +
      '<span class="ch-land-chip">' + esc(ctx.landName) + '</span>' +
      '</span>' +
      '</header>' +
      '<div class="ch-body">' +
      '<aside class="ch-avatar"><div data-avatar></div></aside>' +
      '<div class="ch-main">' +
      (isBoss ? bossBarHtml(cur, ctx) : '') +
      (item.passage ? '<div class="card passage-card" data-passage>' + esc(item.passage) + '</div>' : '') +
      '<div class="card challenge-card" data-card>' +
      '<p class="prompt">' + esc(item.prompt) + '</p>' +
      (item.type === 'tiles' ? tilesHtml(item) : choicesHtml(item)) +
      '<div class="feedback" data-feedback hidden></div>' +
      '<div class="hint-card" data-hint hidden>' +
      '<div class="hint-top" data-hint-top></div>' +
      '<div class="hint-line">💡 <span data-hint-line></span></div></div>' +
      '<div class="reveal-card" data-reveal hidden>' +
      '<div class="reveal-top" data-reveal-top></div>' +
      '<div class="reveal-line" data-reveal-line></div></div>' +
      '</div></div></div>' +
      '</section>';
  }

  // ---------- challenge helpers ----------
  function setSlot(root, idx, letter) {
    const slot = root.querySelector('[data-slot="' + idx + '"]');
    if (!slot) return;
    slot.textContent = letter || '';
    slot.classList.toggle('filled', !!letter);
    slot.classList.remove('reveal-fill');
  }

  function fillSlotsWith(root, word) {
    const slots = root.querySelectorAll('[data-slot]');
    for (let i = 0; i < slots.length; i++) {
      slots[i].textContent = word[i] || '';
      slots[i].classList.add('filled', 'reveal-fill');
    }
  }

  function showFeedback(root, text) {
    const f = root.querySelector('[data-feedback]');
    if (!f) return;
    f.textContent = text;
    f.hidden = false;
  }

  // Hint/reveal cards live at the card bottom — bring them into view so they
  // are never unveiled below the fold. All callers benefit from this.
  function scrollNoteIntoView(el) {
    try {
      if (!el || !el.scrollIntoView) return;
      let smooth = true;
      try { smooth = !Juice.reducedMotion(); } catch (e) { /* default smooth */ }
      el.scrollIntoView({ block: 'nearest', behavior: smooth ? 'smooth' : 'auto' });
    } catch (e) { /* never break the retry flow over a scroll */ }
  }

  function showHint(root, missText, hintText) {
    const h = root.querySelector('[data-hint]');
    if (!h) return;
    root.querySelector('[data-hint-top]').textContent = missText;
    root.querySelector('[data-hint-line]').textContent = hintText;
    h.hidden = false;
    scrollNoteIntoView(h);
  }

  function showReveal(root, revealText, explainText) {
    const r = root.querySelector('[data-reveal]');
    if (!r) return;
    const h = root.querySelector('[data-hint]');
    if (h) h.hidden = true;
    root.querySelector('[data-reveal-top]').textContent = revealText;
    root.querySelector('[data-reveal-line]').textContent = explainText;
    r.hidden = false;
    scrollNoteIntoView(r);
  }

  function clearNotes(root) {
    for (const sel of ['[data-feedback]', '[data-hint]', '[data-reveal]']) {
      const n = root.querySelector(sel);
      if (n) n.hidden = true;
    }
  }

  function markChoiceAnswer(root, answer) {
    const idxs = Array.isArray(answer) ? answer : [answer];
    for (const i of idxs) {
      const btn = root.querySelector('[data-choice="' + i + '"]');
      if (btn) btn.classList.add('is-answer');
    }
  }

  function crackShell(root, hits) {
    const segs = root.querySelectorAll('.shell-seg');
    for (let i = 0; i < segs.length; i++) {
      segs[i].classList.toggle('cracked', i < hits);
    }
  }

  function golemPlay(root, cls) {
    const g = root.querySelector('[data-golem]');
    if (!g) return;
    g.classList.remove('hit', 'block');
    void g.getBoundingClientRect();
    g.classList.add(cls);
    setTimeout(() => { if (g.isConnected) g.classList.remove(cls); }, 650);
  }

  // ---------- celebration ----------
  function celebration(el, data) {
    let stars = '';
    for (let i = 1; i <= 3; i++) {
      stars += '<span class="cele-star" data-star="' + i + '">⭐</span>';
    }
    el.innerHTML =
      '<section class="screen screen-celebrate" data-celebrate>' +
      '<button class="btn btn-ghost cele-mute" data-action="toggle-mute" data-press data-mute-icon aria-label="Sound on or off">' +
      muteIcon(data.muted) + '</button>' +
      '<h1 class="cele-title">' + esc(data.landName) + ' is free!</h1>' +
      '<div class="cele-stars">' + stars + '</div>' +
      (data.companion ? '<div class="cele-egg wobble" data-egg hidden>🥚</div>' : '') +
      (data.companion
        ? '<div class="card cele-card" data-companion hidden>' +
          '<span class="friend-emoji">' + esc(data.companion.emoji) + '</span>' +
          '<span class="friend-name">' + esc(data.companion.name) + '</span>' +
          '<span class="friend-line">' + esc(data.companion.line || '') + '</span></div>'
        : '') +
      '<button class="btn btn-primary btn-big cele-continue" data-action="continue" data-press hidden>Continue ➜</button>' +
      '<div class="cele-skip-note" data-skip-note hidden>Tap anywhere to hurry</div>' +
      '</section>';
  }

  // ---------- mid-run egg hatch overlay ----------
  function eggOverlay(host, companion) {
    const wrap = document.createElement('div');
    wrap.className = 'egg-overlay';
    wrap.innerHTML =
      '<div class="card egg-card">' +
      '<span class="cele-egg wobble" data-egg>🥚</span>' +
      '<span class="friend-emoji" data-egg-friend hidden>' + esc(companion.emoji) + '</span>' +
      '<span class="friend-name" data-egg-name hidden>' + esc(companion.name) + '</span>' +
      '<span class="friend-line" data-egg-line hidden>' + esc(companion.line || '') + '</span>' +
      '<button class="btn btn-primary" data-action="egg-ok" data-press hidden>Hooray!</button>' +
      '</div>';
    host.appendChild(wrap);
    return wrap;
  }

  function eggHatch(wrap) {
    const egg = wrap.querySelector('[data-egg]');
    if (egg) egg.remove();
    for (const sel of ['[data-egg-friend]', '[data-egg-name]', '[data-egg-line]', '[data-action="egg-ok"]']) {
      const n = wrap.querySelector(sel);
      if (n) n.hidden = false;
    }
  }

  // ---------- collection ----------
  function collection(el, list, hatchedIds, landNames) {
    const have = new Set(hatchedIds || []);
    let cards = '';
    for (const c of list) {
      const hatched = have.has(c.id);
      cards +=
        '<div class="card friend' + (hatched ? '' : ' friend-shadow') + '">' +
        '<span class="friend-emoji' + (hatched ? ' bob' : '') + '">' + esc(c.emoji) + '</span>' +
        '<span class="friend-name">' + (hatched ? esc(c.name) : 'A mystery friend') + '</span>' +
        '<span class="friend-land">' + esc((landNames && landNames[c.land]) || c.land) + '</span>' +
        '</div>';
    }
    el.innerHTML =
      '<section class="screen screen-friends">' +
      '<header class="friends-top">' +
      '<button class="btn btn-ghost" data-action="back-map" data-press>🗺️ Map</button>' +
      '<h1 class="friends-title">Charlie&#39;s Friends</h1>' +
      '</header>' +
      '<div class="friends-grid">' + cards + '</div>' +
      '</section>';
  }

  // ---------- settings overlay ----------
  function settings(host, opts) {
    const wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.setAttribute('data-settings-overlay', '');
    wrap.innerHTML =
      '<div class="card settings-card">' +
      '<h2>Settings</h2>' +
      '<button class="btn btn-big" data-action="toggle-mute" data-press data-mute-btn>' +
      muteLabel(opts && opts.muted) + '</button>' +
      '<p class="settings-note">Animations follow this device&#39;s motion setting.</p>' +
      '<p class="settings-note">Replay any land from the map — stars only grow!</p>' +
      '<button class="btn btn-primary" data-action="close-settings" data-press>Done</button>' +
      '</div>';
    host.appendChild(wrap);
    return wrap;
  }

  function muteLabel(muted) {
    return muted ? '🔇 Sound is off' : '🔊 Sound is on';
  }

  function muteIcon(muted) {
    return muted ? '🔇' : '🔊';
  }

  // ---------- balloon travel overlay (between kingdoms) ----------
  // Full-screen, input-blocking, ~2.1s: clouds sweep across (covering the map
  // swap at the midpoint) while the balloon arcs over the top of them.
  function travelOverlay(host) {
    const wrap = document.createElement('div');
    wrap.className = 'travel-overlay';
    const cloud = (cls) =>
      '<g class="tv-cloud ' + cls + '">' +
      '<ellipse cx="0" cy="0" rx="340" ry="150" fill="#f7f5ff"/>' +
      '<ellipse cx="-260" cy="60" rx="240" ry="110" fill="#f7f5ff"/>' +
      '<ellipse cx="250" cy="70" rx="250" ry="115" fill="#f7f5ff"/>' +
      '</g>';
    wrap.innerHTML =
      '<svg viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      cloud('c1') + cloud('c2') + cloud('c3') + cloud('c4') +
      '<g class="tv-balloon">' +
      '<path d="M0 -74 Q-30 -74 -30 -44 Q-30 -20 -12 -8 L12 -8 Q30 -20 30 -44 Q30 -74 0 -74 Z" fill="#ff8e7a"/>' +
      '<path d="M0 -74 Q-12 -74 -12 -44 Q-12 -18 -6 -8 L6 -8 Q12 -18 12 -44 Q12 -74 0 -74 Z" fill="#ffd166"/>' +
      '<line x1="-10" y1="-8" x2="-7" y2="8" stroke="#8c6b33" stroke-width="2"/>' +
      '<line x1="10" y1="-8" x2="7" y2="8" stroke="#8c6b33" stroke-width="2"/>' +
      '<rect x="-10" y="8" width="20" height="14" rx="4" fill="#a05c2c"/>' +
      '</g>' +
      '</svg>';
    host.appendChild(wrap);
    return wrap;
  }

  // ---------- leave-land confirm overlay ----------
  function leaveConfirm(host) {
    const wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.setAttribute('data-leave-overlay', '');
    wrap.innerHTML =
      '<div class="card settings-card">' +
      '<h2>Leave this land?</h2>' +
      '<button class="btn btn-primary btn-big" data-action="leave-stay" data-press>Keep playing!</button>' +
      '<button class="btn btn-big" data-action="leave-go" data-press>🗺️ Go to map</button>' +
      '</div>';
    host.appendChild(wrap);
    return wrap;
  }

  return {
    title, map, challenge, celebration, collection, settings, eggOverlay, eggHatch,
    setSlot, fillSlotsWith, showFeedback, showHint, showReveal, clearNotes,
    markChoiceAnswer, crackShell, golemPlay, muteLabel, muteIcon, leaveConfirm,
    travelOverlay,
  };
})();

// === src/ui/main.js ===
// Main — wires engine, content, audio, juice, particles, world map, avatar and
// screens together. Owns the single rAF loop, screen routing, delegated events,
// the Outcome.events -> audio/particles/toast mapping, and the celebration beat.


const Main = (() => {
  const WORLD1 = ['woods', 'reef', 'mountains', 'palace', 'summit', 'castle'];
  const WORLD2 = ['grove', 'lagoon', 'cliffs', 'maze', 'lighthouse', 'starcastle'];

    maze: 'Mirror Maze', lighthouse: 'Legend Lighthouse', starcastle: 'Star Castle',

  let app = null;
  let game = null;
  let run = null;
  let screen = 'title';
  let landId = null;
  let world = 1;             // which kingdom map is showing (1 or 2)
  let newWorldToast = false; // one-shot nudge after the Crystal Castle falls
  let traveling = false;     // input lock while the balloon flies
  let curView = null;        // latest run.current()
  let bossHits = 0;
  let bossIntroShown = false;
  let busy = false;          // input lock while an outcome plays
  let slotsArr = [];         // [{letter, el}] for tile entry
  let selection = [];        // picked indices for multi-select
  let pendingSubmitTimer = 0;
  let pendingEgg = null;
  let eggWrap = null;
  let settingsEl = null;
  let leaveEl = null;        // "Leave this land?" confirm overlay
  let originalsDone = 0;     // resolved ORIGINAL (non-requeued) challenges, for the dot row
  let revealPending = false; // reveal is showing; tap advances after the hold
  let advanceDeferred = false; // an auto-advance fired while the leave-confirm was open
  let revealReadyTs = 0;     // earliest time a tap may advance the reveal
  let trailUntil = 0;
  let lastTs = 0;
  let celeStart = 0;
  let celeDone = true;
  let celeFinal = null;      // function that jumps celebration to its end state

  const timers = [];
  function timer(ms, fn) {
    const id = setTimeout(() => {
      const i = timers.indexOf(id);
      if (i > -1) timers.splice(i, 1);
      fn();
    }, ms);
    timers.push(id);
    return id;
  }
  function clearTimers() {
    while (timers.length) clearTimeout(timers.pop());
    if (pendingSubmitTimer) {
      clearTimeout(pendingSubmitTimer);
      pendingSubmitTimer = 0;
    }
  }

  function landName(id) {
    return (Copy.landNames && Copy.landNames[id]) || LAND_NAMES[id] || id;
  }
  function isMuted() {
    return !!(game && game.state && game.state.settings && game.state.settings.muted);
  }
  function reduced() {
    try { return Juice.reducedMotion(); } catch (e) { return false; }
  }
  function centerOf(el) {
    if (el) {
      const r = el.getBoundingClientRect();
      if (r.width || r.height) return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
    return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  }

  // ---------------- boot ----------------
  function boot() {
    app = document.getElementById('app');
    const fx = document.getElementById('fx');
    Particles.attach(fx);

    game = Engine.create({
      content: Content,
      copy: Copy,
      companions: Companions,
      store: Persist.createStore(),
      rng: Math.random,
    });

    AudioKit.setMuted(isMuted());

    // reduced motion: bursts become no-ops; CSS fades take over
    Particles.setReduced(reduced());
    try {
      const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (mq && mq.addEventListener) mq.addEventListener('change', (e) => Particles.setReduced(e.matches));
    } catch (e) { /* matchMedia always exists on target Safari */ }

    // Safari requires a user gesture before audio starts. init() is idempotent,
    // so EVERY pointerdown re-runs it — this also revives a context that iOS
    // parked in the non-standard 'interrupted' state (app switch, lock, Siri).
    document.addEventListener('pointerdown', () => AudioKit.init(), { capture: true });
    // ...and nudge an existing context awake when the page becomes visible again.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) AudioKit.poke();
    });
    // soft pop on any button press
    app.addEventListener('pointerdown', (e) => {
      const t = e.target;
      // a reach for backspace must always beat the tile auto-submit
      if (t && t.closest && t.closest('[data-action="backspace"]') && pendingSubmitTimer) {
        clearTimeout(pendingSubmitTimer);
        pendingSubmitTimer = 0;
      }
      if (t && t.closest && t.closest('button')) AudioKit.play('tap');
    });
    Juice.pressify(app);
    app.addEventListener('click', onTap);

    requestAnimationFrame(loop);
    showTitle();
  }

  // ---------------- single rAF loop ----------------
  function loop(ts) {
    const dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0;
    lastTs = ts;
    if (ts < trailUntil) {
      const c = Avatar.center();
      if (c) Particles.sparkleTrail(c.x + (Math.random() - 0.5) * 50, c.y + (Math.random() - 0.5) * 60);
    }
    Particles.tick(dt);
    requestAnimationFrame(loop);
  }

  // ---------------- delegated input ----------------
  function onTap(e) {
    const t = e.target;
    // overlay backdrop tap dismisses, same as the overlay's own button
    if (t && t.classList && t.classList.contains('overlay')) {
      if (t.hasAttribute('data-settings-overlay')) closeSettings();
      else if (t.hasAttribute('data-leave-overlay')) closeLeaveConfirm(true);
      return;
    }
    const actBtn = t && t.closest ? t.closest('[data-action]') : null;
    if (actBtn) {
      handleAction(actBtn.getAttribute('data-action'), actBtn);
      return;
    }
    if (screen === 'celebrate') {
      onCeleTap();
      return;
    }
    if (screen === 'challenge' && revealPending) {
      // reveal: a tap moves on once the minimum hold has passed
      if (performance.now() >= revealReadyTs) {
        revealPending = false;
        proceedAfterResolve();
      }
      return;
    }
    if (screen !== 'challenge' || busy || !run) return;
    const tile = e.target.closest('[data-tile]');
    if (tile) {
      tapTile(tile);
      return;
    }
    const ch = e.target.closest('[data-choice]');
    if (ch) tapChoice(ch);
  }

  function handleAction(action, btn) {
    if (action === 'play') showMap();
    else if (action === 'back-map') {
      // mid-run, confirm before leaving the land
      if (screen === 'challenge' && run) openLeaveConfirm();
      else { clearTimers(); run = null; showMap(); }
    }
    else if (action === 'leave-stay') closeLeaveConfirm(true);
    else if (action === 'leave-go') { closeLeaveConfirm(); clearTimers(); run = null; showMap(); }
    else if (action === 'friends') showCollection();
    else if (action === 'travel') travelTo(world === 1 ? 2 : 1);
    else if (action === 'settings') openSettings();
    else if (action === 'close-settings') closeSettings();
    else if (action === 'toggle-mute') toggleMute(btn);
    else if (action === 'backspace') tilesBackspace();
    else if (action === 'continue') { clearTimers(); showMap(); }
    else if (action === 'egg-ok') resolveEgg();
  }

  // ---------------- routing ----------------
  function showTitle() {
    clearTimers();
    screen = 'title';
    app.removeAttribute('data-land');
    Screens.title(app);
  }

  // Balloon flight between kingdoms. Uses raw setTimeout deliberately:
  // showMap() clears the shared timer pool mid-flight, and the overlay
  // choreography must survive that. The overlay blocks input until removed.
  function travelTo(target) {
    if (traveling || target === world || screen !== 'map') return;
    if (reduced()) {
      world = target;
      showMap();
      return;
    }
    traveling = true;
    AudioKit.play('pop');
    const ov = Screens.travelOverlay(document.body);
    setTimeout(() => { world = target; showMap(); }, 1050); // swap under cloud cover
    setTimeout(() => AudioKit.play('hatch'), 1550);          // landing chime
    setTimeout(() => {
      if (ov && ov.isConnected) ov.remove();
      traveling = false;
    }, 2200);
  }

  function nextLandHighlight(order) {
    for (const id of order) {
      const st = game.landStatus(id);
      if (st.unlocked && st.stars === 0) return id;
    }
    return null;
  }

  function showMap(highlight) {
    clearTimers();
    run = null;
    screen = 'map';
    app.removeAttribute('data-land');
    const order = world === 2 ? WORLD2 : WORLD1;
    // the Starlight Kingdom appears once the Crystal Castle has a star
    const world2Open = game.landStatus('grove').unlocked;
    Screens.map(app, {
      title: world === 2 ? 'Charlie&#39;s Starlight Kingdom' : 'Charlie&#39;s Crystal Kingdom',
      travel: world === 2 ? '💎 Crystal Kingdom' : (world2Open ? '🌠 Starlight Kingdom' : ''),
    });
    const container = app.querySelector('[data-worldmap]');
    const lands = order.map((id) => {
      const st = game.landStatus(id);
      return { id, name: landName(id), unlocked: st.unlocked, stars: st.stars };
    });
    const completedCount = lands.filter((l) => l.stars > 0).length;
    const hl = highlight === undefined ? nextLandHighlight(order) : highlight;
    WorldMap.render(
      container,
      { lands, completedCount, highlight: hl, world, travel: world === 2 || world2Open },
      startLand,
      () => travelTo(world === 1 ? 2 : 1)
    );
    // once per app load: point at the travel button while world 2 is untouched
    if (world === 1 && world2Open && !newWorldToast
      && WORLD2.every((id) => game.landStatus(id).stars === 0)) {
      newWorldToast = true;
      try { Juice.toast('🌠 A new kingdom appears in the stars!', 3500); } catch (e) { /* toast only */ }
    }
  }

  function showCollection() {
    clearTimers();
    screen = 'friends';
    app.removeAttribute('data-land');
    Screens.collection(app, Companions.list, game.state.companions, Copy.landNames || LAND_NAMES);
  }

  function openSettings() {
    if (settingsEl && settingsEl.isConnected) return;
    settingsEl = Screens.settings(app, { muted: isMuted() });
  }
  function closeSettings() {
    if (settingsEl) {
      settingsEl.remove();
      settingsEl = null;
    }
  }
  function openLeaveConfirm() {
    if (leaveEl && leaveEl.isConnected) return;
    // freeze pending auto-submits so the dialog can't have the rug pulled
    if (pendingSubmitTimer) {
      clearTimeout(pendingSubmitTimer);
      pendingSubmitTimer = 0;
    }
    leaveEl = Screens.leaveConfirm(app);
  }
  function closeLeaveConfirm(resume) {
    if (leaveEl) {
      leaveEl.remove();
      leaveEl = null;
    }
    if (resume && advanceDeferred) {
      advanceDeferred = false;
      proceedAfterResolve();
    } else if (!resume) {
      advanceDeferred = false;
    }
  }
  function toggleMute() {
    const m = !isMuted();
    game.setMuted(m); // persists immediately per contract
    AudioKit.setMuted(m);
    // keep every visible mute control in step (settings card + screen headers)
    for (const b of app.querySelectorAll('[data-mute-btn]')) b.textContent = Screens.muteLabel(m);
    for (const b of app.querySelectorAll('[data-mute-icon]')) b.textContent = Screens.muteIcon(m);
  }

  // ---------------- land run ----------------
  function startLand(id) {
    const st = game.landStatus(id);
    if (!st.unlocked) {
      Juice.toast('Light up the path to open this land!');
      return;
    }
    clearTimers();
    landId = id;
    world = WORLD2.indexOf(id) > -1 ? 2 : 1;
    bossHits = 0;
    bossIntroShown = false;
    originalsDone = 0;
    run = game.startLand(id);
    screen = 'challenge';
    renderChallengeScreen();
  }

  function renderChallengeScreen() {
    const cur = run ? run.current() : null;
    if (!cur) { showMap(); return; }
    closeLeaveConfirm(); // a re-render replaces app HTML; drop the stale handle
    curView = cur;
    slotsArr = [];
    selection = [];
    pendingEgg = null;
    busy = false;
    revealPending = false;
    // Dot row renders from ORIGINAL challenge counts so requeued items never
    // grow it. Prefer engine-provided fields; fall back to a local count.
    if (cur.phase === 'challenge') {
      if (typeof cur.originalsTotal !== 'number') cur.originalsTotal = 8;
      if (typeof cur.originalsDone !== 'number') cur.originalsDone = originalsDone;
    }
    app.setAttribute('data-land', landId);
    if (cur.phase === 'boss' && !bossIntroShown) {
      bossIntroShown = true;
      // two sentences need a longer hold than the default toast
      try { Juice.toast(Copy.bossIntro(landId), 3500); } catch (e) { /* keep playing */ }
    }
    Screens.challenge(app, cur, {
      landId,
      landName: landName(landId),
      bossHits,
      muted: isMuted(),
      isFinale: FINALE_IDS.indexOf(landId) > -1,
    });
    Avatar.mount(app.querySelector('[data-avatar]'));
  }

  // ---------------- tiles paradigm ----------------
  function tapTile(tile) {
    if (!curView || curView.item.type !== 'tiles') return;
    if (tile.classList.contains('tile-used')) return;
    const word = curView.item.word;
    if (slotsArr.length >= word.length) return;
    const letter = tile.getAttribute('data-tile');
    tile.classList.add('tile-used');
    slotsArr.push({ letter, el: tile });
    Screens.setSlot(app, slotsArr.length - 1, letter);
    if (slotsArr.length === word.length) {
      // unhurried pause: backspace stays available before auto-submit, and a
      // pointerdown on backspace cancels this timer (wired in boot)
      pendingSubmitTimer = setTimeout(() => {
        pendingSubmitTimer = 0;
        submitAnswer(slotsArr.map((s) => s.letter).join(''));
      }, 1200);
    }
  }

  function tilesBackspace() {
    if (busy || !slotsArr.length) return;
    if (pendingSubmitTimer) {
      clearTimeout(pendingSubmitTimer);
      pendingSubmitTimer = 0;
    }
    const last = slotsArr.pop();
    Screens.setSlot(app, slotsArr.length, null);
    if (last && last.el) last.el.classList.remove('tile-used');
  }

  function resetAttemptInputs() {
    if (!curView) return;
    if (curView.item.type === 'tiles') {
      for (let i = 0; i < slotsArr.length; i++) Screens.setSlot(app, i, null);
      for (const s of slotsArr) if (s.el) s.el.classList.remove('tile-used');
      slotsArr = [];
    } else {
      for (const b of app.querySelectorAll('.choice.picked')) b.classList.remove('picked');
      selection = [];
    }
  }

  // ---------------- choices paradigm ----------------
  function tapChoice(btn) {
    if (!curView || curView.item.type !== 'choice') return;
    const idx = parseInt(btn.getAttribute('data-choice'), 10);
    const multi = Array.isArray(curView.item.answerIndices);
    if (!multi) {
      btn.classList.add('picked');
      submitAnswer(idx);
      return;
    }
    // Multi-select stays toggleable until the pending submit fires: removing a
    // pick cancels it; it re-arms whenever exactly 2 picks are selected again.
    const at = selection.indexOf(idx);
    if (at > -1) {
      if (pendingSubmitTimer) {
        clearTimeout(pendingSubmitTimer);
        pendingSubmitTimer = 0;
      }
      selection.splice(at, 1);
      btn.classList.remove('picked');
      return;
    }
    if (selection.length >= 2) return; // a third pick is ignored; any timer keeps running
    selection.push(idx);
    btn.classList.add('picked');
    if (selection.length === 2) {
      if (pendingSubmitTimer) {
        clearTimeout(pendingSubmitTimer);
        pendingSubmitTimer = 0;
      }
      pendingSubmitTimer = setTimeout(() => {
        pendingSubmitTimer = 0;
        if (selection.length === 2) submitAnswer(selection.slice());
      }, 900);
    }
  }

  // ---------------- outcome handling ----------------
  function submitAnswer(answer) {
    if (!run) return;
    busy = true;
    if (pendingSubmitTimer) {
      clearTimeout(pendingSubmitTimer);
      pendingSubmitTimer = 0;
    }
    const out = run.submit(answer);
    handleOutcome(out);
  }

  function handleOutcome(out) {
    let streakN = 1;
    let levelup = false;
    let bossHit = false;
    let bossBlock = false;
    pendingEgg = null;
    for (const ev of out.events || []) {
      if (ev.type === 'streak') streakN = ev.n;
      else if (ev.type === 'levelup') levelup = true;
      else if (ev.type === 'egg') pendingEgg = ev.companion;
      else if (ev.type === 'bossHit') bossHit = true;
      else if (ev.type === 'bossBlock') bossBlock = true;
    }
    // track resolved ORIGINAL challenges locally (dot-row fallback, see L2)
    if (out.resolved && curView && curView.phase === 'challenge' && !curView.item.requeued) {
      originalsDone += 1;
    }
    const card = app.querySelector('[data-card]');

    if (out.status === 'correct') {
      AudioKit.play('correct');
      Screens.clearNotes(app);
      Screens.showFeedback(app, out.feedback);
      Avatar.trick(streakN);
      trailUntil = performance.now() + 950;
      if (reduced()) {
        if (card) {
          card.classList.add('soft-flash');
          timer(750, () => card.classList.remove('soft-flash'));
        }
      } else {
        const c = centerOf(card);
        Particles.burst('shatter', c.x, c.y - 30);
      }
      if (bossHit) {
        bossHits++;
        Screens.crackShell(app, bossHits);
        Screens.golemPlay(app, 'hit');
        AudioKit.play('bossHit');
        if (!reduced()) {
          const g = centerOf(app.querySelector('[data-golem]'));
          Particles.burst('shatter', g.x, g.y, { count: 20 });
        }
      }
      if (levelup) {
        timer(300, () => {
          AudioKit.play('levelup');
          try { Juice.toast(Copy.levelup(Math.random)); } catch (e) { /* toast only */ }
          if (!reduced()) {
            const c = centerOf(card);
            Particles.burst('sparkle', c.x, c.y - 60, { count: 18 });
          }
        });
      }
      timer(1200, proceedAfterResolve);
      return;
    }

    if (out.status === 'retry') {
      // gentle shake -> hint card -> she tries again; never harsh
      AudioKit.play('miss');
      if (bossBlock) Screens.golemPlay(app, 'block');
      if (card) Juice.shake(card);
      Screens.showHint(app, out.feedback, out.hint || run.hint());
      resetAttemptInputs();
      busy = false;
      return;
    }

    // 'reveal': friendly reveal with one-line explanation. She holds it for at
    // least 2.8s, then any tap moves on; a ~7s auto-advance means she is never
    // stuck (mirrors the celebration skip pattern).
    AudioKit.play('pop');
    if (bossBlock) Screens.golemPlay(app, 'block');
    Screens.showReveal(app, out.feedback, out.explain);
    if (curView.item.type === 'tiles') {
      Screens.fillSlotsWith(app, String(out.correctAnswer || '').toUpperCase());
    } else {
      Screens.markChoiceAnswer(app, out.correctAnswer);
    }
    revealPending = true;
    revealReadyTs = performance.now() + 2800;
    timer(7000, () => {
      if (revealPending) {
        revealPending = false;
        proceedAfterResolve();
      }
    });
  }

  function proceedAfterResolve() {
    if (leaveEl && leaveEl.isConnected) {
      // she's deciding whether to leave; hold the advance until she answers
      advanceDeferred = true;
      return;
    }
    if (pendingEgg) {
      const comp = pendingEgg;
      pendingEgg = null;
      eggMoment(comp);
      return;
    }
    advanceNow();
  }

  function advanceNow() {
    clearTimers();
    if (!run) { showMap(); return; }
    const res = run.advance();
    if (res && res.finished) {
      showCelebration(res);
    } else if (res) {
      renderChallengeScreen();
    } else {
      showMap();
    }
  }

  // ---------------- mid-run egg hatch ----------------
  function eggMoment(companion) {
    eggWrap = Screens.eggOverlay(app, companion);
    timer(1100, () => {
      AudioKit.play('hatch');
      if (!reduced() && eggWrap) {
        const c = centerOf(eggWrap.querySelector('.egg-card'));
        Particles.burst('hatch', c.x, c.y);
      }
      if (eggWrap) Screens.eggHatch(eggWrap);
    });
  }
  function resolveEgg() {
    if (eggWrap) {
      eggWrap.remove();
      eggWrap = null;
    }
    advanceNow();
  }

  // ---------------- celebration (the signature beat) ----------------
  function showCelebration(res) {
    clearTimers();
    run = null;
    screen = 'celebrate';
    const id = res.landId || landId;
    app.setAttribute('data-land', id);
    const comp = res.bossCompanion || null;
    Screens.celebration(app, { landName: landName(id), stars: res.stars, companion: comp, muted: isMuted() });
    celeStart = performance.now();
    celeDone = false;

    const stage = app.querySelector('[data-celebrate]');
    const stars = Math.max(1, Math.min(3, res.stars | 0));
    const noMotion = reduced();

    AudioKit.play('fanfare');
    if (!noMotion) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      timer(120, () => Particles.burst('confetti', w * 0.5, h * 0.3));
      timer(520, () => Particles.burst('confetti', w * 0.22, h * 0.38, { count: 45 }));
      timer(940, () => Particles.burst('confetti', w * 0.78, h * 0.38, { count: 45 }));
    }

    // star reveal, one by one
    for (let i = 1; i <= stars; i++) {
      timer(1400 + (i - 1) * 700, () => {
        const star = stage.querySelector('[data-star="' + i + '"]');
        if (star) {
          star.classList.add('lit');
          AudioKit.play('pop');
          if (!noMotion) {
            const c = centerOf(star);
            Particles.burst('sparkle', c.x, c.y, { count: 14 });
          }
        }
      });
    }

    let t = 1400 + stars * 700 + 250;
    if (comp) {
      const eggT = t;
      timer(eggT, () => {
        const egg = stage.querySelector('[data-egg]');
        if (egg) egg.hidden = false;
      });
      timer(eggT + 1200, () => {
        AudioKit.play('hatch');
        const egg = stage.querySelector('[data-egg]');
        if (egg) {
          if (!noMotion) {
            const c = centerOf(egg);
            Particles.burst('hatch', c.x, c.y);
          }
          egg.hidden = true;
        }
        const cardEl = stage.querySelector('[data-companion]');
        if (cardEl) cardEl.hidden = false;
      });
      t = eggT + 1900;
    }
    timer(2000, () => {
      if (!celeDone) {
        const note = stage.querySelector('[data-skip-note]');
        if (note) note.hidden = false;
      }
    });
    timer(t, finishCele);

    celeFinal = () => {
      for (let i = 1; i <= stars; i++) {
        const star = stage.querySelector('[data-star="' + i + '"]');
        if (star) star.classList.add('lit');
      }
      const egg = stage.querySelector('[data-egg]');
      if (egg) egg.hidden = true;
      const cardEl = stage.querySelector('[data-companion]');
      if (cardEl) cardEl.hidden = false;
      const note = stage.querySelector('[data-skip-note]');
      if (note) note.hidden = true;
      const cont = stage.querySelector('[data-action="continue"]');
      if (cont) cont.hidden = false;
    };
  }

  function finishCele() {
    if (celeDone) return;
    celeDone = true;
    clearTimers();
    if (celeFinal) celeFinal();
  }

  function onCeleTap() {
    // skippable by tap after 2 seconds
    if (!celeDone && performance.now() - celeStart > 2000) finishCele();
  }

  // ---------------- start ----------------
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  }

  return { boot };
})();

})();
</script>
</body>
</html>
