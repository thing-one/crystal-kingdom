<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crystal Kingdom">
<meta name="format-detection" content="telephone=no">
<title>&#x1F48E; Charlie's Crystal Kingdom</title>
<style>
/* === src/ui/styles.css === */
/* ============================================================
   Charlie's Crystal Kingdom — visual system
   Palette: twilight indigo base, aurora violet, crystal teal,
   warm coral, star gold, cloud white. No external assets.
   ============================================================ */

:root {
  --indigo-deep: #12103a;
  --indigo: #1d1b4b;
  --indigo-soft: #2c2766;
  --violet: #8b5cf6;
  --aurora: #a78bfa;
  --aurora-soft: #c4b5fd;
  --teal: #2dd4bf;
  --teal-soft: #7ef0e2;
  --coral: #ff8e7a;
  --coral-soft: #ffb3a3;
  --gold: #ffd166;
  --gold-soft: #ffe9a8;
  --white: #f7f5ff;
  --ink: #241f52;

  /* land theme defaults (map screen) */
  --land-a: var(--aurora);
  --land-b: var(--teal);
  --land-glow: rgba(167, 139, 250, 0.45);

  --glass: rgba(255, 255, 255, 0.12);
  --glass-edge: rgba(255, 255, 255, 0.28);
  --shadow-deep: 0 18px 40px rgba(8, 6, 30, 0.45);
  --shadow-soft: 0 8px 22px rgba(8, 6, 30, 0.3);
  --radius: 24px;
  --tap: 64px;
}

/* per-land hue theming */
[data-land='woods']    { --land-a: #4ade80; --land-b: #2dd4bf; --land-glow: rgba(74, 222, 128, 0.4); }
[data-land='reef']     { --land-a: #2dd4bf; --land-b: #38bdf8; --land-glow: rgba(45, 212, 191, 0.4); }
[data-land='mountains']{ --land-a: #93c5fd; --land-b: #c4b5fd; --land-glow: rgba(147, 197, 253, 0.4); }
[data-land='palace']   { --land-a: #a78bfa; --land-b: #f0abfc; --land-glow: rgba(167, 139, 250, 0.45); }
[data-land='summit']   { --land-a: #ffd166; --land-b: #ff8e7a; --land-glow: rgba(255, 209, 102, 0.45); }
[data-land='castle']   { --land-a: #7ef0e2; --land-b: #c4b5fd; --land-glow: rgba(126, 240, 226, 0.5); }

/* world 2 — Starlight Kingdom */
[data-land='grove']      { --land-a: #6ee7b7; --land-b: #a3e635; --land-glow: rgba(110, 231, 183, 0.4); }
[data-land='lagoon']     { --land-a: #38bdf8; --land-b: #818cf8; --land-glow: rgba(56, 189, 248, 0.4); }
[data-land='cliffs']     { --land-a: #c4b5fd; --land-b: #f0abfc; --land-glow: rgba(196, 181, 253, 0.4); }
[data-land='maze']       { --land-a: #e879f9; --land-b: #7ef0e2; --land-glow: rgba(232, 121, 249, 0.45); }
[data-land='lighthouse'] { --land-a: #fbbf24; --land-b: #38bdf8; --land-glow: rgba(251, 191, 36, 0.45); }
[data-land='starcastle'] { --land-a: #ffd166; --land-b: #f0abfc; --land-glow: rgba(255, 209, 102, 0.5); }

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--indigo-deep);
}

body {
  font-family: ui-rounded, -apple-system, system-ui, 'Segoe UI', sans-serif;
  color: var(--white);
  -webkit-text-size-adjust: 100%;
}

.game-surface, .game-surface * {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 110%, var(--indigo-soft) 0%, var(--indigo) 45%, var(--indigo-deep) 100%);
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

#fx {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 60;
}

/* ---------- screens ---------- */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  animation: cck-screen-in 0.45s ease both;
}
@keyframes cck-screen-in {
  from { opacity: 0; transform: scale(1.02); }
  to   { opacity: 1; transform: scale(1); }
}

/* ---------- buttons ---------- */
button {
  font: inherit;
  color: inherit;
  border: none;
  background: none;
  cursor: pointer;
}

.btn {
  min-width: var(--tap);
  min-height: var(--tap);
  padding: 12px 26px;
  border-radius: 22px;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.01em;
  background: var(--glass);
  border: 1.5px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: var(--shadow-soft);
  color: var(--white);
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
}
.btn:active, .tile:active, .choice:active, [data-press]:active {
  transform: scale(0.93);
  box-shadow: 0 3px 10px rgba(8, 6, 30, 0.35);
}
.btn-primary {
  background: linear-gradient(135deg, var(--violet), var(--teal));
  border-color: rgba(255, 255, 255, 0.45);
  text-shadow: 0 1px 3px rgba(8, 6, 30, 0.35);
}
.btn-ghost { font-size: 22px; padding: 10px 18px; }
.btn-big { font-size: 28px; padding: 16px 32px; }

/* ---------- glass cards ---------- */
.card {
  background: var(--glass);
  border: 1.5px solid var(--glass-edge);
  border-radius: var(--radius);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  box-shadow: var(--shadow-deep);
}

/* ============================================================
   TITLE SCREEN
   ============================================================ */
.screen-title {
  align-items: center;
  justify-content: center;
  gap: 26px;
  text-align: center;
  padding: 24px;
}
.title-gem {
  font-size: 84px;
  line-height: 1;
  filter: drop-shadow(0 0 24px rgba(126, 240, 226, 0.65));
  animation: cck-bob 2.6s ease-in-out infinite;
}
.game-title {
  font-size: clamp(40px, 7vw, 76px);
  font-weight: 800;
  line-height: 1.05;
}
.game-title .grad {
  display: block;
  background: linear-gradient(100deg, var(--gold), var(--teal-soft), var(--aurora-soft), var(--gold));
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  animation: cck-shimmer-text 5s linear infinite;
}
@keyframes cck-shimmer-text {
  from { background-position: 0% 0; }
  to   { background-position: 250% 0; }
}
.title-spark { display: inline-block; animation: cck-twinkle 1.8s ease-in-out infinite; color: var(--gold); }
.title-spark:nth-child(2n) { animation-delay: 0.6s; }
.title-sub { font-size: 24px; color: var(--aurora-soft); }
.btn-play {
  font-size: 40px;
  padding: 22px 70px;
  border-radius: 36px;
  background: linear-gradient(135deg, var(--coral), var(--gold));
  border: 2px solid rgba(255, 255, 255, 0.5);
  color: #4a2418;
  box-shadow: 0 14px 34px rgba(255, 142, 122, 0.4), var(--shadow-soft);
  animation: cck-breathe 2.2s ease-in-out infinite;
}
@keyframes cck-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* ============================================================
   MAP SCREEN
   ============================================================ */
.screen-map { overflow: hidden; }
.map-stage { position: absolute; inset: 0; }
.map-stage svg { width: 100%; height: 100%; display: block; }
.map-top {
  position: absolute;
  top: max(10px, env(safe-area-inset-top));
  left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 18px;
  z-index: 5;
  pointer-events: none;
}
.map-top .btn { pointer-events: auto; }
.map-title {
  font-size: clamp(22px, 3.4vw, 34px);
  font-weight: 800;
  text-shadow: 0 2px 12px rgba(8, 6, 30, 0.6);
}
.map-actions { display: flex; gap: 12px; }

/* balloon dock on the map */
.wm-balloon { cursor: pointer; }
.wm-balloon .wm-float { animation: cck-island-float 5.2s ease-in-out infinite; }

/* balloon travel overlay: clouds sweep across, balloon arcs over the top */
.travel-overlay {
  position: fixed;
  inset: 0;
  z-index: 80;
  pointer-events: all;
}
.travel-overlay::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 1;
  background: #f7f5ff;
  opacity: 0;
  animation: tv-veil 2.1s ease-in-out forwards;
}
.travel-overlay svg {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  display: block;
}
.tv-cloud { opacity: 0.96; }
.tv-cloud.c1 { animation: tv-sweep-a 2.1s ease-in-out forwards; }
.tv-cloud.c2 { animation: tv-sweep-b 2.1s ease-in-out forwards; }
.tv-cloud.c3 { animation: tv-sweep-a 2.1s ease-in-out forwards; animation-delay: 0.08s; }
.tv-cloud.c4 { animation: tv-sweep-b 2.1s ease-in-out forwards; animation-delay: 0.14s; }
.tv-balloon { animation: tv-balloon 2.1s ease-in-out forwards; }
@keyframes tv-veil {
  0%   { opacity: 0; }
  42%  { opacity: 1; }
  58%  { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes tv-sweep-a {
  0%   { transform: translate(-700px, 420px) scale(1.1); }
  45%  { transform: translate(180px, 360px) scale(1.5); }
  55%  { transform: translate(320px, 350px) scale(1.5); }
  100% { transform: translate(1500px, 300px) scale(1.2); }
}
@keyframes tv-sweep-b {
  0%   { transform: translate(1700px, 170px) scale(1.2); }
  45%  { transform: translate(740px, 220px) scale(1.5); }
  55%  { transform: translate(600px, 230px) scale(1.5); }
  100% { transform: translate(-900px, 260px) scale(1.1); }
}
@keyframes tv-balloon {
  0%   { transform: translate(110px, 540px) scale(0.9); }
  50%  { transform: translate(490px, 130px) scale(1.5); }
  100% { transform: translate(890px, 560px) scale(0.9); }
}

/* travel button between the two kingdoms */
.btn-travel {
  font-size: 22px;
  padding: 10px 18px;
  border: 2px solid var(--gold);
  animation: cck-travel-pulse 2.2s ease-in-out infinite;
}
@keyframes cck-travel-pulse {
  0%, 100% { box-shadow: 0 0 0 2px rgba(255, 209, 102, 0.25), var(--shadow-soft); }
  50%      { box-shadow: 0 0 0 8px rgba(255, 209, 102, 0.45), var(--shadow-soft); }
}

/* --- world map SVG pieces --- */
.wm-cloud { animation: cck-drift 26s linear infinite; }
.wm-cloud.c2 { animation-duration: 38s; animation-delay: -14s; }
.wm-cloud.c3 { animation-duration: 50s; animation-delay: -30s; }
@keyframes cck-drift {
  from { transform: translateX(-220px); }
  to   { transform: translateX(1220px); }
}
.wm-skystar { animation: cck-twinkle 2.4s ease-in-out infinite; }
@keyframes cck-twinkle {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 1; }
}
.wm-aurora {
  animation: cck-aurora 9s ease-in-out infinite alternate;
  mix-blend-mode: screen;
}
@keyframes cck-aurora {
  from { opacity: 0.25; transform: translateY(0); }
  to   { opacity: 0.6;  transform: translateY(-14px); }
}
.wm-path {
  stroke-dasharray: 10 16;
  animation: cck-path-flow 3.2s linear infinite;
}
@keyframes cck-path-flow {
  from { stroke-dashoffset: 0; }
  to   { stroke-dashoffset: -52; }
}

.wm-land { cursor: pointer; }
.wm-land .wm-float { animation: cck-island-float 5.4s ease-in-out infinite; }
.wm-land:nth-of-type(2n) .wm-float { animation-delay: -2.7s; }
@keyframes cck-island-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}
.wm-land[data-state='locked'] { filter: saturate(0.18) brightness(0.72); }
.wm-land[data-state='locked'] .wm-float { animation: none; }
.wm-land[data-state='done'] { filter: drop-shadow(0 0 16px var(--land-glow, rgba(255, 209, 102, 0.5))); }
.wm-land[data-state='done'] .wm-doneglow { animation: cck-glow-pulse 2.6s ease-in-out infinite; }
@keyframes cck-glow-pulse {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.85; }
}
.wm-land.wm-next .wm-ring { animation: cck-next-pulse 1.6s ease-in-out infinite; }
@keyframes cck-next-pulse {
  0%, 100% { opacity: 0.15; transform: scale(0.96); }
  50% { opacity: 0.8; transform: scale(1.06); }
}
.wm-name { font-weight: 800; }

.wm-tree { transform-origin: center bottom; transform-box: fill-box; animation: cck-sway 3.4s ease-in-out infinite; }
.wm-tree.t2 { animation-delay: -1.2s; }
.wm-tree.t3 { animation-delay: -2.3s; }
@keyframes cck-sway {
  0%, 100% { transform: rotate(-2.5deg); }
  50% { transform: rotate(2.5deg); }
}
.wm-wave { animation: cck-wave 3s ease-in-out infinite; }
.wm-wave.w2 { animation-delay: -1.5s; }
@keyframes cck-wave {
  0%, 100% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
}
.wm-snow { animation: cck-snowfall 4.6s linear infinite; }
.wm-snow.s2 { animation-delay: -1.6s; }
.wm-snow.s3 { animation-delay: -3.1s; }
@keyframes cck-snowfall {
  from { transform: translateY(-34px); opacity: 0; }
  20%  { opacity: 0.9; }
  90%  { opacity: 0.7; }
  to   { transform: translateY(30px); opacity: 0; }
}
.wm-facet { animation: cck-facet 2.8s ease-in-out infinite; }
.wm-facet.f2 { animation-delay: -0.9s; }
.wm-facet.f3 { animation-delay: -1.8s; }
@keyframes cck-facet {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 1; }
}
.wm-halo { animation: cck-glow-pulse 3s ease-in-out infinite; }

/* ============================================================
   CHALLENGE SCREEN
   ============================================================ */
.screen-challenge { padding: 6px 14px 12px; }
.ch-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 4px;
  min-height: 72px;
}
.ch-top-right { display: flex; align-items: center; gap: 12px; }
.ch-land-chip {
  font-size: 22px;
  font-weight: 800;
  padding: 8px 18px;
  border-radius: 18px;
  background: linear-gradient(120deg, var(--land-a), var(--land-b));
  color: var(--indigo-deep);
  box-shadow: var(--shadow-soft);
}
.dots { display: flex; gap: 9px; align-items: center; }
.dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.22);
  position: relative;
}
.dot.done { background: var(--gold); box-shadow: 0 0 8px rgba(255, 209, 102, 0.7); }
.dot.now {
  background: var(--white);
  animation: cck-dot-now 1.2s ease-in-out infinite;
}
@keyframes cck-dot-now {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.35); }
}
.dot-egg::after {
  content: '🥚';
  position: absolute;
  font-size: 13px;
  top: -17px; left: 50%;
  transform: translateX(-50%);
}
.dot-egg.done::after { content: '✨'; }

.ch-body {
  flex: 1;
  display: flex;
  align-items: stretch;
  gap: 16px;
  min-height: 0;
}
.ch-avatar {
  flex: 0 0 190px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 10px;
}
.ch-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  /* flex-start + auto-margin spacers: centers when content fits, and the top
     stays reachable when it overflows (justify-content:center would push
     overflow above the scroll origin and clip long boss passages). */
  justify-content: flex-start;
  gap: 12px;
  min-width: 0;
  overflow: hidden auto;
}
.ch-main::before { content: ''; margin-top: auto; }
.ch-main::after { content: ''; margin-bottom: auto; }

.challenge-card {
  position: relative;
  padding: 22px 26px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  border-top: 4px solid var(--land-a);
}
.prompt { font-size: clamp(24px, 3vw, 32px); font-weight: 800; line-height: 1.25; }

.passage-card {
  padding: 18px 24px;
  font-size: clamp(22px, 2.6vw, 28px);
  line-height: 1.5;
  font-weight: 600;
  color: var(--white);
  background: rgba(255, 255, 255, 0.16);
  max-height: 38vh;
  overflow-y: auto;
}

/* --- tiles paradigm --- */
.word-clue { display: flex; align-items: center; gap: 14px; font-size: 24px; color: var(--gold-soft); }
.clue-emoji { font-size: 44px; }
.slots { display: flex; gap: 10px; flex-wrap: wrap; }
.slot {
  width: var(--tap); height: var(--tap);
  border-radius: 16px;
  border: 2.5px dashed rgba(255, 255, 255, 0.4);
  background: rgba(255, 255, 255, 0.07);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  font-weight: 800;
}
.slot.filled {
  border-style: solid;
  border-color: var(--teal-soft);
  background: rgba(45, 212, 191, 0.22);
  animation: cck-pop-in 0.18s ease;
}
.slot.reveal-fill { border-color: var(--gold); background: rgba(255, 209, 102, 0.25); color: var(--gold-soft); }
@keyframes cck-pop-in {
  from { transform: scale(0.6); }
  to   { transform: scale(1); }
}
.tile-bank { display: flex; gap: 12px; flex-wrap: wrap; }
.tile {
  width: var(--tap); height: var(--tap);
  min-width: var(--tap); min-height: var(--tap);
  border-radius: 18px;
  font-size: 34px;
  font-weight: 800;
  color: var(--ink);
  background: linear-gradient(160deg, var(--white), #ddd6ff);
  border: 1.5px solid rgba(255, 255, 255, 0.7);
  box-shadow: 0 6px 0 rgba(120, 100, 220, 0.45), var(--shadow-soft);
  transition: transform 0.1s ease, opacity 0.2s ease;
}
.tile-used { opacity: 0.18; pointer-events: none; box-shadow: none; }
.tile-back {
  background: linear-gradient(160deg, var(--coral-soft), var(--coral));
  color: #5b1f12;
  font-size: 30px;
}

/* --- choices paradigm --- */
.choices {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.choices.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choice {
  min-height: 84px;
  min-width: var(--tap);
  padding: 14px 18px;
  border-radius: 20px;
  font-size: clamp(24px, 2.8vw, 32px);
  font-weight: 800;
  color: var(--white);
  background: rgba(255, 255, 255, 0.13);
  border: 2.5px solid rgba(255, 255, 255, 0.3);
  box-shadow: var(--shadow-soft);
  transition: transform 0.1s ease, border-color 0.15s ease, background 0.15s ease;
  word-break: break-word;
}
.choices.big .choice { font-size: clamp(36px, 5vw, 54px); min-height: 100px; }
.choice.picked {
  border-color: var(--teal-soft);
  background: rgba(45, 212, 191, 0.25);
  box-shadow: 0 0 0 4px rgba(126, 240, 226, 0.35), var(--shadow-soft);
}
.choice.is-answer {
  border-color: var(--gold);
  background: rgba(255, 209, 102, 0.28);
  box-shadow: 0 0 0 5px rgba(255, 209, 102, 0.45), var(--shadow-soft);
  animation: cck-answer-glow 0.9s ease-in-out 2;
}
@keyframes cck-answer-glow {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

/* --- feedback / hint / reveal --- */
.feedback {
  font-size: 26px;
  font-weight: 800;
  color: var(--gold);
  text-align: center;
  animation: cck-pop-in 0.25s ease;
}
.hint-card {
  border-radius: 18px;
  padding: 14px 20px;
  background: linear-gradient(135deg, rgba(255, 142, 122, 0.25), rgba(255, 209, 102, 0.22));
  border: 1.5px solid rgba(255, 209, 102, 0.5);
  animation: cck-rise-in 0.3s ease;
}
.hint-card .hint-top { font-size: 22px; font-weight: 700; color: var(--coral-soft); }
.hint-card .hint-line { font-size: 25px; font-weight: 800; color: var(--gold-soft); margin-top: 4px; }
.reveal-card {
  border-radius: 18px;
  padding: 14px 20px;
  background: rgba(255, 209, 102, 0.16);
  border: 1.5px solid rgba(255, 209, 102, 0.55);
  animation: cck-rise-in 0.3s ease;
}
.reveal-card .reveal-top { font-size: 22px; font-weight: 700; color: var(--gold-soft); }
.reveal-card .reveal-line { font-size: 25px; font-weight: 800; margin-top: 4px; }
@keyframes cck-rise-in {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.soft-flash { animation: cck-soft-flash 0.7s ease; }
@keyframes cck-soft-flash {
  0% { background-color: rgba(255, 255, 255, 0.12); }
  40% { background-color: rgba(126, 240, 226, 0.3); }
  100% { background-color: rgba(255, 255, 255, 0.12); }
}

/* --- boss --- */
.boss-bar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 8px 18px;
  border-radius: 20px;
  background: rgba(8, 6, 30, 0.35);
  border: 1.5px solid var(--glass-edge);
}
.golem { width: 96px; height: 96px; flex: 0 0 auto; }
.golem svg { width: 100%; height: 100%; display: block; }
.golem .golem-rig { animation: cck-bob 2.8s ease-in-out infinite; transform-origin: 50% 80%; }
.golem.block .golem-rig { animation: cck-golem-block 0.55s ease; }
@keyframes cck-golem-block {
  0% { transform: translateX(0); }
  25% { transform: translateX(-7px) rotate(-3deg); }
  55% { transform: translateX(6px) rotate(2.5deg); }
  100% { transform: translateX(0); }
}
.golem.hit .golem-rig { animation: cck-golem-hit 0.5s ease; }
@keyframes cck-golem-hit {
  0% { transform: scale(1); }
  35% { transform: scale(0.9) rotate(2deg); }
  100% { transform: scale(1); }
}
.shell { display: flex; gap: 8px; flex: 1; }
.shell-seg {
  flex: 1;
  height: 30px;
  border-radius: 10px;
  background: linear-gradient(150deg, var(--teal-soft), var(--aurora));
  border: 1.5px solid rgba(255, 255, 255, 0.55);
  box-shadow: 0 0 10px rgba(126, 240, 226, 0.45);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.shell-seg.cracked {
  opacity: 0.22;
  transform: scaleY(0.45);
  background: linear-gradient(150deg, #6f6a9c, #4d4880);
  box-shadow: none;
}
.boss-name { font-size: 22px; font-weight: 800; color: var(--aurora-soft); }

/* ============================================================
   AVATAR
   ============================================================ */
.avatar { width: 170px; height: 230px; }
.avatar svg { width: 100%; height: 100%; display: block; overflow: visible; }
.av-rig { transform-origin: 60px 120px; transform-box: view-box; }
.av-rig.av-idle { animation: cck-bob 2.4s ease-in-out infinite; }
@keyframes cck-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
.av-pony { transform-origin: 76px 30px; transform-box: view-box; animation: cck-pony 2.4s ease-in-out infinite; }
@keyframes cck-pony {
  0%, 100% { transform: rotate(-4deg); }
  50% { transform: rotate(7deg); }
}
.av-rig.av-cartwheel { animation: cck-cartwheel 1s ease-in-out both; }
@keyframes cck-cartwheel {
  0%   { transform: rotate(0) translateX(0); }
  50%  { transform: rotate(180deg) translateX(-10px) scale(1.04); }
  100% { transform: rotate(360deg) translateX(0); }
}
.av-rig.av-flip { animation: cck-flip 1.05s cubic-bezier(0.34, 1.3, 0.5, 1) both; }
@keyframes cck-flip {
  0%   { transform: translateY(0) rotate(0); }
  20%  { transform: translateY(-12px) rotate(-20deg) scaleY(0.92); }
  60%  { transform: translateY(-72px) rotate(-300deg); }
  85%  { transform: translateY(-6px) rotate(-360deg); }
  100% { transform: translateY(0) rotate(-360deg); }
}
.av-rig.av-stuck { animation: cck-stuck 1.35s ease-in-out both; }
@keyframes cck-stuck {
  0%   { transform: translateY(0) rotate(0); }
  18%  { transform: translateY(-16px) rotate(-30deg) scaleY(0.9); }
  48%  { transform: translateY(-86px) rotate(-380deg) scale(1.06); }
  72%  { transform: translateY(0) rotate(-720deg) scaleY(0.8) scaleX(1.12); }
  84%  { transform: translateY(-10px) rotate(-720deg) scaleY(1.05); }
  100% { transform: translateY(0) rotate(-720deg) scale(1); }
}

/* ============================================================
   CELEBRATION
   ============================================================ */
.screen-celebrate {
  align-items: center;
  justify-content: center;
  gap: 24px;
  text-align: center;
  padding: 28px;
}
.cele-title {
  font-size: clamp(38px, 6vw, 64px);
  font-weight: 800;
  background: linear-gradient(100deg, var(--gold), var(--teal-soft), var(--gold));
  background-size: 220% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  animation: cck-shimmer-text 4s linear infinite;
}
.cele-stars { display: flex; gap: 22px; }
.cele-star {
  font-size: 84px;
  line-height: 1;
  opacity: 0.18;
  filter: saturate(0);
  transform: scale(0.7);
  transition: none;
}
.cele-star.lit {
  opacity: 1;
  filter: saturate(1) drop-shadow(0 0 22px rgba(255, 209, 102, 0.8));
  animation: cck-star-pop 0.55s cubic-bezier(0.34, 1.6, 0.5, 1) both;
}
@keyframes cck-star-pop {
  0% { transform: scale(0.2) rotate(-30deg); }
  70% { transform: scale(1.25) rotate(6deg); }
  100% { transform: scale(1) rotate(0); }
}
.cele-egg { font-size: 92px; line-height: 1; }
.cele-egg.wobble { animation: cck-egg-wobble 0.9s ease-in-out infinite; }
@keyframes cck-egg-wobble {
  0%, 100% { transform: rotate(-9deg); }
  50% { transform: rotate(9deg); }
}
.cele-card, .egg-card {
  padding: 22px 34px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  animation: cck-rise-in 0.45s ease both;
}
.cele-card .friend-emoji, .egg-card .friend-emoji { font-size: 76px; animation: cck-bob 2s ease-in-out infinite; }
.cele-card .friend-name, .egg-card .friend-name { font-size: 30px; font-weight: 800; color: var(--gold); }
.cele-card .friend-line, .egg-card .friend-line { font-size: 23px; color: var(--aurora-soft); }
.cele-skip-note { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); font-size: 18px; color: rgba(247, 245, 255, 0.55); }
.cele-mute {
  position: absolute;
  top: max(12px, env(safe-area-inset-top));
  right: max(14px, env(safe-area-inset-right));
}

/* egg overlay mid-run */
.egg-overlay {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(13, 11, 42, 0.62);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  animation: cck-screen-in 0.3s ease both;
}

/* ============================================================
   COLLECTION — Charlie's Friends
   ============================================================ */
.screen-friends { padding: 12px 18px; gap: 10px; }
.friends-top { display: flex; align-items: center; gap: 16px; min-height: 72px; }
.friends-title { font-size: clamp(28px, 4vw, 40px); font-weight: 800; color: var(--gold-soft); }
.friends-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  overflow-y: auto;
  padding: 6px 2px 18px;
  align-content: start;
}
.friend {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 16px 10px;
  min-height: 150px;
  justify-content: center;
}
.friend-emoji { font-size: 56px; line-height: 1; }
.friend .bob { animation: cck-bob 2.2s ease-in-out infinite; }
.friend:nth-child(2n) .bob { animation-delay: -1.1s; }
.friend:nth-child(3n) .bob { animation-delay: -0.6s; }
.friend-name { font-size: 19px; font-weight: 800; text-align: center; }
.friend-land { font-size: 15px; color: var(--aurora-soft); }
.friend-shadow .friend-emoji { filter: brightness(0) opacity(0.45); }
.friend-shadow .friend-name { color: rgba(247, 245, 255, 0.45); }

/* ============================================================
   SETTINGS OVERLAY
   ============================================================ */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(13, 11, 42, 0.6);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  animation: cck-screen-in 0.25s ease both;
}
.settings-card {
  width: min(440px, 88vw);
  padding: 30px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-items: stretch;
  text-align: center;
}
.settings-card h2 { font-size: 32px; font-weight: 800; }
.settings-note { font-size: 20px; color: var(--aurora-soft); line-height: 1.4; }

/* ============================================================
   PORTRAIT LAYOUT
   ============================================================ */
@media (orientation: portrait) {
  .ch-body { flex-direction: column; gap: 6px; }
  .ch-avatar { flex: 0 0 auto; order: 2; padding-bottom: 0; }
  .avatar { width: 120px; height: 160px; }
  .ch-main { order: 1; padding-top: 6px; }
  /* 2 columns keeps all 4 choices above the fold (a single stacked column
     pushed the 4th below it); 72px still well past the 64px tap floor. */
  .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choices.n3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choices.big { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choice { min-height: 72px; }
  .passage-card { max-height: 26vh; }
  .map-title { font-size: 20px; }
  .boss-bar { flex-wrap: wrap; }
  .cele-star { font-size: 64px; }
}

@media (max-width: 740px) {
  .btn { font-size: 20px; }
  .prompt { font-size: 22px; }
}

/* ============================================================
   REDUCED MOTION — every animation gets a calm alternate
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  .screen { animation: cck-fade-in 0.4s ease both; }
  @keyframes cck-fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .title-gem, .btn-play, .game-title .grad, .cele-title, .btn-travel,
  .wm-cloud, .wm-skystar, .wm-aurora, .wm-path, .wm-balloon .wm-float,
  .wm-land .wm-float, .wm-tree, .wm-wave, .wm-snow, .wm-facet, .wm-halo,
  .wm-land[data-state='done'] .wm-doneglow, .wm-land.wm-next .wm-ring,
  .dot.now, .av-pony, .golem .golem-rig, .friend .bob,
  .cele-card .friend-emoji, .egg-card .friend-emoji, .title-spark {
    animation: none;
  }
  .av-rig.av-idle { animation: none; }
  .av-rig.av-cartwheel, .av-rig.av-flip, .av-rig.av-stuck {
    animation: cck-gentle-bounce 0.7s ease both;
  }
  @keyframes cck-gentle-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .golem.block .golem-rig { animation: cck-dim 0.5s ease; }
  .golem.hit .golem-rig { animation: cck-dim 0.5s ease; }
  @keyframes cck-dim {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .slot.filled, .feedback { animation: cck-fade-in 0.3s ease both; }
  .hint-card, .reveal-card, .cele-card, .egg-card { animation: cck-fade-in 0.35s ease both; }
  .choice.is-answer { animation: none; }
  .cele-star { transition: opacity 0.5s ease, filter 0.5s ease; }
  .cele-star.lit { animation: none; transform: scale(1); }
  .cele-egg.wobble { animation: cck-dim 1.2s ease infinite; }
  .egg-overlay, .overlay { animation: cck-fade-in 0.3s ease both; }
  .soft-flash { animation: cck-fade-in 0.5s ease; }
}

/* === src/ui/juice.css === */
/* juice.css — toasts, press states, shake/dim. Twilight glass aesthetic:
   indigo base, crystal teal edges, star-gold accents. No external refs. */

/* ---- toast -------------------------------------------------------------- */

.jz-toast-wrap {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  z-index: 9000;
}

.jz-toast {
  max-width: min(86vw, 480px);
  padding: 14px 26px;
  border-radius: 22px;
  font-family: ui-rounded, -apple-system, system-ui, sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-align: center;
  color: #fdf6e3;
  background: linear-gradient(
    155deg,
    rgba(49, 46, 129, 0.92),
    rgba(30, 27, 75, 0.92)
  );
  border: 1.5px solid rgba(94, 234, 212, 0.45);
  box-shadow:
    0 10px 30px rgba(14, 11, 46, 0.45),
    0 2px 8px rgba(14, 11, 46, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.18);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  opacity: 0;
  transform: translateY(-28px) scale(0.9);
  user-select: none;
  -webkit-user-select: none;
}

.jz-toast-in {
  animation: jz-toast-spring 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
}

.jz-toast-out {
  opacity: 1;
  transform: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
  opacity: 0;
  transform: translateY(-16px) scale(0.94);
}

@keyframes jz-toast-spring {
  0% {
    opacity: 0;
    transform: translateY(-32px) scale(0.85);
  }
  60% {
    opacity: 1;
    transform: translateY(4px) scale(1.03);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ---- springy press states ------------------------------------------------ */

[data-press] {
  transition:
    transform 0.18s cubic-bezier(0.2, 1.6, 0.4, 1),
    box-shadow 0.18s cubic-bezier(0.2, 1.6, 0.4, 1),
    filter 0.18s ease;
  will-change: transform;
}

[data-press].is-pressed {
  transform: scale(0.93);
  box-shadow:
    0 2px 6px rgba(14, 11, 46, 0.35),
    inset 0 1px 2px rgba(14, 11, 46, 0.2);
  filter: brightness(1.08) saturate(1.05);
}

/* ---- shake (gentle, horizontal) ------------------------------------------ */

.jz-shake {
  animation: jz-shake-soft 0.46s ease-in-out;
}

@keyframes jz-shake-soft {
  0%, 100% { transform: translateX(0); }
  18% { transform: translateX(-7px); }
  38% { transform: translateX(6px); }
  58% { transform: translateX(-4px); }
  78% { transform: translateX(3px); }
}

/* ---- dim (reduced-motion substitute for shake) ---------------------------- */

.jz-dim {
  animation: jz-dim-soft 0.36s ease-in-out;
}

@keyframes jz-dim-soft {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

/* ---- reduced motion overrides --------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  .jz-toast-in {
    animation: jz-toast-fade 0.25s ease forwards;
  }

  @keyframes jz-toast-fade {
    from { opacity: 0; transform: none; }
    to { opacity: 1; transform: none; }
  }

  .jz-toast-out {
    transition: opacity 0.25s ease;
    transform: none;
  }

  [data-press] {
    transition: filter 0.15s ease;
  }

  [data-press].is-pressed {
    transform: none;
    filter: brightness(1.12);
  }

  .jz-shake {
    animation: none;
  }
}

// === src/content/mathgen.js ===
// src/content/mathgen.js — procedural arithmetic generator.
// Deterministic given the injected rng (() => float in [0,1)).
// Distractors come from plausible slips: ±1, ±10, digit-swap, dropped-regroup.
// Always 3 distractors: unique, >= 0, != answer.
// T1: a+b <= 10. T2: sums <= 20, subtraction within 10.
// T3: subtraction within 20 (start 11-20; T2 owns within-10), three addends <= 20.
// T4: two-digit + one-digit (no regroup), missing addend within 20.
// T5: two-digit ± two-digit (simple regrouping), doubles/halves, groups-of.
const MathGen = (() => {
  const ri = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
  const digitSwap = (n) => {
    if (n < 10 || n > 99) return null;
    const t = Math.floor(n / 10);
    const o = n % 10;
    return t === o ? null : o * 10 + t;
  };
  const shuffleInPlace = (rng, arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  };
  const distractorsFor = (rng, answer, extras, exclude) => {
    const banned = exclude || [];
    const pool = [];
    const push = (v) => {
      if (Number.isInteger(v) && v >= 0 && v !== answer && banned.indexOf(v) === -1 && pool.indexOf(v) === -1) pool.push(v);
    };
    (extras || []).forEach(push);
    push(answer + 1);
    push(answer - 1);
    push(answer + 10);
    push(answer - 10);
    push(digitSwap(answer));
    shuffleInPlace(rng, pool);
    const picked = pool.slice(0, 3);
    let k = 2;
    while (picked.length < 3) {
      const v = answer + k;
      if (v >= 0 && v !== answer && banned.indexOf(v) === -1 && picked.indexOf(v) === -1) picked.push(v);
      k += 1;
    }
    return picked;
  };
  const makeItem = (rng, tier, kind, idPart, prompt, answer, extras, hint, explain, big, exclude) => {
    const choices = distractorsFor(rng, answer, extras, exclude).map(String);
    const answerIndex = Math.floor(rng() * (choices.length + 1));
    choices.splice(answerIndex, 0, String(answer));
    return {
      id: 'm-t' + tier + '-' + kind + '-' + idPart,
      domain: 'math',
      tier,
      type: 'choice',
      prompt,
      hint,
      explain,
      choices,
      answerIndex,
      bigChoices: !!big,
      answer, // internal: lets validators verify without parsing the prompt
    };
  };
  const genAdd = (rng, tier, maxSum) => {
    const a = ri(rng, 1, maxSum - 1);
    const b = ri(rng, 1, maxSum - a);
    const ans = a + b;
    return makeItem(
      rng, tier, 'add', a + '-' + b,
      a + ' + ' + b + ' = ?', ans, [],
      'Count up from the bigger number.',
      a + ' + ' + b + ' = ' + ans + ' — count up to check!'
    );
  };
  const genSub = (rng, tier, minStart, maxStart) => {
    const a = ri(rng, minStart, maxStart);
    const b = ri(rng, 1, a - 1);
    const ans = a - b;
    return makeItem(
      rng, tier, 'sub', a + '-' + b,
      a + ' − ' + b + ' = ?', ans, [],
      'Count back on your fingers, slow and steady.',
      a + ' − ' + b + ' = ' + ans + ' — count back to check!'
    );
  };
  const genThree = (rng) => {
    const a = ri(rng, 1, 8);
    const b = ri(rng, 1, 8);
    const c = ri(rng, 1, Math.max(1, 20 - a - b));
    const ans = a + b + c;
    return makeItem(
      rng, 3, 'three', a + '-' + b + '-' + c,
      a + ' + ' + b + ' + ' + c + ' = ?', ans, [],
      'Add the first two, then add the last.',
      a + ' + ' + b + ' + ' + c + ' = ' + ans + '. Step by step!'
    );
  };
  const genTwoPlusOne = (rng) => {
    const tens = ri(rng, 1, 9);
    const ones = ri(rng, 0, 8);
    const t = tens * 10 + ones;
    const o = ri(rng, 1, 9 - ones);
    const ans = t + o;
    return makeItem(
      rng, 4, 'big1', t + '-' + o,
      t + ' + ' + o + ' = ?', ans, [],
      'Only the ones change — add those first.',
      t + ' + ' + o + ' = ' + ans + '. Tens stay, ones grow!'
    );
  };
  const genMissing = (rng) => {
    const total = ri(rng, 6, 20);
    const known = ri(rng, 1, total - 1);
    const ans = total - known;
    // distractors must never equal the visible known/total numbers, or the
    // answer could be ruled out by copying numbers straight from the prompt
    return makeItem(
      rng, 4, 'miss', known + '-' + total,
      '▢ + ' + known + ' = ' + total + '  What goes in the box?', ans, [],
      'Count up from the number to the total.',
      ans + ' + ' + known + ' = ' + total + ' — ' + ans + ' fills the box!',
      false, [known, total]
    );
  };
  const genBigAdd = (rng) => {
    const a = ri(rng, 10, 89);
    const b = ri(rng, 10, 99 - a);
    const ans = a + b;
    const extras = [];
    if ((a % 10) + (b % 10) >= 10) extras.push(ans - 10); // dropped the carry
    return makeItem(
      rng, 5, 'badd', a + '-' + b,
      a + ' + ' + b + ' = ?', ans, extras,
      'Add the tens, then add the ones.',
      a + ' + ' + b + ' = ' + ans + '. Tens, then ones!'
    );
  };
  const genBigSub = (rng) => {
    const a = ri(rng, 21, 99);
    const b = ri(rng, 10, a - 1);
    const ans = a - b;
    const extras = [];
    if (a % 10 < b % 10) {
      // classic slip: take the small ones digit from the big one, skip the borrow
      extras.push((Math.floor(a / 10) - Math.floor(b / 10)) * 10 + Math.abs((a % 10) - (b % 10)));
    }
    return makeItem(
      rng, 5, 'bsub', a + '-' + b,
      a + ' − ' + b + ' = ?', ans, extras,
      'Take away the tens, then the ones.',
      a + ' − ' + b + ' = ' + ans + '. Tens, then ones!'
    );
  };
  const genDouble = (rng) => {
    const n = ri(rng, 2, 12);
    const ans = n + n;
    return makeItem(
      rng, 5, 'dbl', String(n),
      'Double ' + n + ' = ?', ans, [],
      'A double is the number plus itself.',
      'Double ' + n + ' is ' + ans + ' — ' + n + ' plus ' + n + '!'
    );
  };
  const genHalf = (rng) => {
    const half = ri(rng, 1, 10);
    const n = half * 2;
    return makeItem(
      rng, 5, 'half', String(n),
      'Half of ' + n + ' = ?', half, [],
      'Split the number into two matching parts.',
      'Half of ' + n + ' is ' + half + ' — two equal parts!'
    );
  };
  const groupEmojis = ['🍎', '⭐', '🐚', '🍓', '🐠'];
  const genGroups = (rng) => {
    const g = ri(rng, 2, 4);
    const per = ri(rng, 2, 5);
    const emo = groupEmojis[ri(rng, 0, groupEmojis.length - 1)];
    const ans = g * per;
    return makeItem(
      rng, 5, 'grp', g + '-' + per + '-' + emo.codePointAt(0).toString(16),
      g + ' groups of ' + emo.repeat(per) + ' = ?', ans, [],
      'Count one group, then skip-count the rest.',
      g + ' groups of ' + per + ' makes ' + ans + '!',
      true
    );
  };
  const generate = (tier, rng) => {
    const t = Math.max(1, Math.min(5, Math.round(tier)));
    if (t === 1) return genAdd(rng, 1, 10);
    if (t === 2) return rng() < 0.5 ? genAdd(rng, 2, 20) : genSub(rng, 2, 2, 10);
    if (t === 3) return rng() < 0.5 ? genSub(rng, 3, 11, 20) : genThree(rng);
    if (t === 4) return rng() < 0.5 ? genTwoPlusOne(rng) : genMissing(rng);
    const r = rng();
    if (r < 0.25) return genBigAdd(rng);
    if (r < 0.5) return genBigSub(rng);
    if (r < 0.7) return genDouble(rng);
    if (r < 0.85) return genHalf(rng);
    return genGroups(rng);
  };
  return { generate };
})();

// === src/content/reading.js ===
// src/content/reading.js — reading comprehension bank.
// 40 passages (8 per tier), 2 questions each. Themes: kingdom, gymnastics,
// animals. Every answer is derivable from the passage alone.
// Anti-tell: engine shuffles positions; the correct answer is never uniquely
// longest, and whenever the correct answer echoes passage wording at least
// one distractor echoes the passage too (validator-enforced).
const ReadingBank = (() => {
  let rdCount = 0;
  const bank = { 1: [], 2: [], 3: [], 4: [], 5: [] };
  const rd = (tier, passage, prompt, choices, answerIndex, hint, explain) => {
    bank[tier].push({
      id: 'rd-t' + tier + '-' + String(++rdCount).padStart(3, '0'),
      domain: 'reading',
      tier,
      type: 'choice',
      prompt,
      hint,
      explain,
      passage,
      choices,
      answerIndex,
      bigChoices: false,
    });
  };
  const hLook = 'The answer hides in the story — look back!';
  const hDetail = 'Reread the story and hunt for that detail.';
  const hOrder = 'Look for order words like first and next.';
  const hMain = 'Think about the whole story, not one part.';
  const hFeel = 'Look for clues about her body and face.';
  const hClue = 'Find the sentence that shows it happening.';
  const hVocab = 'Reread that sentence and picture what happens.';
  const hTwist = 'Reread the ending — it holds a surprise.';

  // ---- Tier 1: two sentences, literal questions ----
  const p1 = 'Charlie found a pink crystal by the path. She put it in her bag.';
  rd(1, p1, 'What did Charlie find?',
    ['a crystal', 'a tiny frog', 'a stony path'], 0,
    hLook, 'She found a pink crystal by the path.');
  rd(1, p1, 'Where did Charlie put the crystal?',
    ['in her bag', 'in her shoe', 'by the path'], 0,
    hLook, 'She put the crystal in her bag.');

  const p2 = 'Charlie did a cartwheel on the soft mat. Her coach clapped two times.';
  rd(1, p2, 'What did Charlie do?',
    ['a cartwheel', 'a high jump', 'a soft nap'], 0,
    hLook, 'Charlie did a cartwheel on the mat.');
  rd(1, p2, 'How many times did the coach clap?',
    ['two', 'four', 'ten'], 0,
    hLook, 'Her coach clapped two times.');

  const p3 = 'A little fox slept under a big tree. Snow fell softly on its red tail.';
  rd(1, p3, 'Where did the fox sleep?',
    ['under a tree', 'on a little hill', 'next to a river'], 0,
    hLook, 'The fox slept under a big tree.');
  rd(1, p3, "What fell on the fox's tail?",
    ['snow', 'rain', 'little leaves'], 0,
    hLook, 'Snow fell softly on its red tail.');

  // ---- Tier 2: three sentences, detail questions ----
  const p4 = 'The Crystal Castle has four tall towers. Each tower holds one shiny flag. The flags are purple and gold.';
  rd(2, p4, 'How many towers does the castle have?',
    ['four towers', 'three towers', 'five towers', 'six towers'], 0,
    hDetail, 'The castle has four tall towers.');
  rd(2, p4, 'What colors are the flags?',
    ['purple and gold', 'red and blue', 'gold and green', 'pink and silver'], 0,
    hDetail, 'The flags are purple and gold.');

  const p5 = 'Charlie practiced on the balance beam. First she walked slowly across it. Then she did a tiny hop at the end.';
  rd(2, p5, 'What did Charlie do at the end?',
    ['a tiny hop', 'a slow walk', 'a big flip', 'a quick wave'], 0,
    hDetail, 'She did a tiny hop at the end.');
  rd(2, p5, 'How did Charlie walk at first?',
    ['slowly', 'quickly', 'with a tiny hop', 'sideways'], 0,
    hDetail, 'First she walked slowly across the beam.');

  const p6 = 'Pebble the penguin loves cold water. Every morning he slides down an icy hill. Then he splashes into the sea with his friends.';
  rd(2, p6, 'What does Pebble slide down?',
    ['an icy hill', 'a sandy dune', 'a green slide', 'a snowy roof'], 0,
    hDetail, 'Pebble slides down an icy hill.');
  rd(2, p6, 'Who splashes into the sea with Pebble?',
    ['his friends', 'his mother', 'three cold seals', 'one big whale'], 0,
    hDetail, 'He splashes in with his friends.');

  // ---- Tier 3: 4-5 sentences, sequence / main idea ----
  const p7 = 'Charlie followed the winding path to Word Woods. First she crossed a wobbly bridge. Next she hopped over three mossy stones. At last she reached the singing trees, and they waved their branches hello.';
  rd(3, p7, 'What did Charlie do first?',
    ['crossed a wobbly bridge', 'hopped over mossy stones', 'reached the singing trees', 'waved at the branches'], 0,
    hOrder, 'First she crossed a wobbly bridge.');
  rd(3, p7, 'What is this story mostly about?',
    ["Charlie's trip to Word Woods", 'how wobbly bridges get built', 'a song the trees like to sing', 'three stones by a river'], 0,
    hMain, "It tells about Charlie's trip to Word Woods.");

  const p8 = 'On Saturday Charlie went to the big gym. She stretched first so her muscles felt warm. Then she practiced cartwheels until they felt strong. Before going home, she took one giant bow.';
  rd(3, p8, 'What did Charlie do before cartwheels?',
    ['she stretched', 'she took a bow', 'she went home', 'she ate a snack'], 0,
    hOrder, 'She stretched first to warm up her muscles.');
  rd(3, p8, 'What did Charlie do last at the gym?',
    ['took a giant bow', 'practiced cartwheels', 'stretched her muscles', 'opened the gym door'], 0,
    hOrder, 'Before going home, she took one giant bow.');

  const p9 = 'Coral the turtle wanted to see the top of the reef. She paddled up past the tall orange seaweed. She rested on a smooth rock halfway. Finally she reached the top and watched the sun sparkle on the waves.';
  rd(3, p9, 'Where did Coral rest?',
    ['on a smooth rock', 'on the orange seaweed', 'at the top of the reef', 'under the waves'], 0,
    hOrder, 'She rested on a smooth rock halfway up.');
  rd(3, p9, 'What is this story mostly about?',
    ["Coral's climb up the reef", 'a very sunny day at the beach', 'how seaweed gets so tall', 'a rock under the sea'], 0,

// === src/content/content.js ===
// src/content/content.js — aggregator implementing the Content API.

const Content = (() => {
  const banks = {
    words: WordsBank,
    rhyme: RhymesBank,
    patterns: PatternsBank,
    reading: ReadingBank,
  };
  const cloneItem = (it) => {
    const copy = { ...it };
    if (Array.isArray(it.choices)) copy.choices = it.choices.slice();
    if (Array.isArray(it.answerIndices)) copy.answerIndices = it.answerIndices.slice();
    return copy;
  };
  const bank = (domain, tier) => {
    const b = banks[domain];
    if (!b) return [];
    const t = Math.max(1, Math.min(5, Math.round(tier)));
    return (b[t] || []).map(cloneItem);
  };
  const generate = (domain, tier, rng) => {
    if (domain === 'math') return MathGen.generate(tier, rng);
    const items = bank(domain, tier);
    if (!items.length) return null;
    return items[Math.min(items.length - 1, Math.floor(rng() * items.length))];
  };
  const counts = () => {
    const total = (b) => Object.keys(b).reduce((n, t) => n + b[t].length, 0);
    const passages = new Set();
    Object.keys(ReadingBank).forEach((t) => {
      ReadingBank[t].forEach((it) => passages.add(it.passage));
    });
    return {
      words: total(WordsBank),
      rhyme: total(RhymesBank),
      patterns: total(PatternsBank),
      reading: passages.size,
      math: 'generative',
    };
  };
  return { bank, generate, counts };
})();

const Adaptive = (() => {
  // Ability deltas per resolution outcome (contract: first/hinted/miss/repaired).
  // first-try step retuned from the brief's +0.34 after simulation (R5):
  // with 4-choice items, above-skill success can't drop below the ~25%
  // guessing floor, so descent is rate-capped and a +0.34 climb forces a

const MissQueue = (() => {
  // Random re-insert offset: 3, 4, or 5 positions later.
  function offset(rng) {
    return 3 + Math.floor(rng() * 3);
  }

  // create() returns a session-scoped tracker: each item id may be requeued
  // at most once per session, and an already-requeued copy never requeues.
  function create() {
    const used = new Set();
    return {
      hasRequeued(id) {
        return used.has(id);
      },
      // Splices a { ...item, requeued: true } copy into `queue` 3-5 positions
      // after `pos` (clamped to the end of the queue). Returns true if inserted.
      tryRequeue(queue, pos, item, rng) {
        if (!item || item.requeued || used.has(item.id)) return false;
        used.add(item.id);
        const at = Math.min(pos + offset(rng), queue.length);
        queue.splice(at, 0, Object.assign({}, item, { requeued: true }));
        return true;
      },
    };
  }

  return { create, offset };
})();

const Persist = (() => {
  const KEY = 'cck-save';
  const DOMAIN_KEYS = ['words', 'reading', 'rhyme', 'math', 'patterns'];

    const mem = new Map();
    return {
      getItem(k) { return mem.has(k) ? mem.get(k) : null; },
      setItem(k, v) { mem.set(k, String(v)); },
      removeItem(k) { mem.delete(k); },

      if (typeof storage.removeItem === 'function') storage.removeItem(k);
      return ok;
    } catch (e) {
      return false;
    }
  }

  function valid(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data)) return false;
    if (data.v !== 1) return false;
    if (!data.abilities || typeof data.abilities !== 'object') return false;
    for (let i = 0; i < DOMAIN_KEYS.length; i++) {
      const a = data.abilities[DOMAIN_KEYS[i]];
      if (typeof a !== 'number' || !Number.isFinite(a)) return false;
    }
    if (!data.lands || typeof data.lands !== 'object' || Array.isArray(data.lands)) return false;
    if (!Array.isArray(data.companions)) return false;
    if (!data.settings || typeof data.settings !== 'object') return false;
    return true;
  }

  // createStore(storageLike?) -> { load() -> state|null, save(state), available }
  // Defaults to globalThis.localStorage; any failure -> in-memory fallback.
  // load() returns null for corrupt JSON / unknown version / missing keys. Never throws.
  function createStore(storageLike) {
    let candidate = storageLike;
    if (candidate === undefined) {
      try { candidate = globalThis.localStorage; } catch (e) { candidate = undefined; }
    }
    let backing;
    let available = false;
    if (candidate && probe(candidate)) {
      backing = candidate;
      available = true;
    } else {
      backing = memoryStorage();
      available = false;
    }
    return {
      available,
      load() {
        try {
          const raw = backing.getItem(KEY);
          if (raw === null || raw === undefined) return null;
          const data = JSON.parse(raw);
          return valid(data) ? data : null;
        } catch (e) {
          return null;
        }
      },
      save(state) {
        try {
          const s = state || {};
          backing.setItem(KEY, JSON.stringify({
            v: 1,
            abilities: s.abilities,
            lands: s.lands,
            companions: s.companions,
            settings: s.settings,
          }));
          return true;
        } catch (e) {
          return false;
        }
      },
    };
  }

  return { KEY, createStore };
})();

const Session = (() => {

    grove: 'words', lagoon: 'rhyme', cliffs: 'math', maze: 'patterns', lighthouse: 'reading',
  };

  const FINALES = ['castle', 'starcastle'];

    for (let i = a.length - 1; i > 0; i--) {

      const t = a[i]; a[i] = a[j]; a[j] = t;

  // 2-letter words: reverse. All-identical letters: order cannot differ; return as-is.
  function shuffleTiles(word, rng) {
    const letters = String(word).split('');
    if (letters.length < 2) return letters;
    if (letters.length === 2) return [letters[1], letters[0]];
    let distinct = false;
    for (let i = 1; i < letters.length; i++) if (letters[i] !== letters[0]) { distinct = true; break; }
    if (!distinct) return letters.slice();
    let tiles = shuffled(letters, rng);
    let guard = 0;
    while (tiles.join('') === word && guard++ < 50) tiles = shuffled(letters, rng);
    if (tiles.join('') === word) tiles = letters.slice(1).concat(letters[0]);

      item.choices = order.map((i) => base.choices[i]);
      if (Array.isArray(base.answerIndices)) {

          .map((a) => order.indexOf(a))

const Engine = (() => {
  const LAND_ORDER = ['woods', 'reef', 'mountains', 'palace', 'summit'];
  // World 2 (Starlight Kingdom) opens once the Crystal Castle has a star.
  const WORLD2_ORDER = ['grove', 'lagoon', 'cliffs', 'maze', 'lighthouse'];
  const ALL_LANDS = [
    'woods', 'reef', 'mountains', 'palace', 'summit', 'castle',
    'grove', 'lagoon', 'cliffs', 'maze', 'lighthouse', 'starcastle',
  ];

  function freshState() {
    const lands = {};
    for (let i = 0; i < ALL_LANDS.length; i++) lands[ALL_LANDS[i]] = { stars: 0 };
    return {
      abilities: Object.assign({}, Adaptive.START),
      lands,
      companions: [],
      settings: { muted: false },
    };
  }

  // Merge a loaded save into a fresh state, defensively (loaded already passed
  // Persist validation, but clamp/shape everything anyway).
  function hydrate(loaded) {
    const s = freshState();
    if (!loaded) return s;
    const domains = Object.keys(s.abilities);
    for (let i = 0; i < domains.length; i++) {
      const d = domains[i];
      const a = loaded.abilities && loaded.abilities[d];
      if (typeof a === 'number' && Number.isFinite(a)) s.abilities[d] = Adaptive.clamp(a);
    }
    for (let i = 0; i < ALL_LANDS.length; i++) {
      const l = ALL_LANDS[i];
      const st = loaded.lands && loaded.lands[l] && loaded.lands[l].stars;
      if (st === 0 || st === 1 || st === 2 || st === 3) s.lands[l] = { stars: st };
    }
    if (Array.isArray(loaded.companions)) {
      s.companions = loaded.companions.filter((c) => typeof c === 'string');
    }
    if (loaded.settings && typeof loaded.settings.muted === 'boolean') {
      s.settings.muted = loaded.settings.muted;
    }
    return s;
  }

  // Engine.create({ content, copy, companions, store, rng }) -> game facade.
  function create(opts) {
    const options = opts || {};
    const content = options.content;
    const copy = options.copy;
    const companions = options.companions;
    const store = options.store;
    const rng = options.rng || Math.random;

    let loaded = null;
    try {
      loaded = store && typeof store.load === 'function' ? store.load() : null;
    } catch (e) {
      loaded = null; // a hostile store must never block boot
    }
    const state = hydrate(loaded);

    const game = {
      state,
      landStatus(landId) {
        const stars = (state.lands[landId] && state.lands[landId].stars) || 0;
        const starsOf = (id) => (state.lands[id] && state.lands[id].stars) || 0;
        const allStarred = (order) => order.every((id) => starsOf(id) >= 1);
        if (landId === 'woods') return { unlocked: true, stars };
        if (landId === 'castle') return { unlocked: allStarred(LAND_ORDER), stars };
        // World 2: grove opens after the Crystal Castle; then the chain repeats.
        if (landId === 'grove') return { unlocked: starsOf('castle') >= 1, stars };
        if (landId === 'starcastle') return { unlocked: allStarred(WORLD2_ORDER), stars };
        const w2 = WORLD2_ORDER.indexOf(landId);
        if (w2 > 0) return { unlocked: starsOf(WORLD2_ORDER[w2 - 1]) >= 1, stars };
        const i = LAND_ORDER.indexOf(landId);
        if (i < 0) return { unlocked: false, stars };
        return { unlocked: starsOf(LAND_ORDER[i - 1]) >= 1, stars };
      },
      setMuted(muted) {
        state.settings.muted = !!muted;
        game.save();
      },
      save() {
        try {
          if (store && typeof store.save === 'function') {
            store.save({
              v: 1,
              abilities: state.abilities,
              lands: state.lands,
              companions: state.companions,
              settings: state.settings,
            });
          }
        } catch (e) {
          // a hostile store must never break gameplay (mirror of the load guard)
        }

      startLand(landId) {
        return Session.createRun(ctx, landId);
      },
    };

    // one miss-queue (once per item id per session), one seen-id set, one streak.
    const ctx = {
      content,
      copy,
      companions,
      rng,
      state,
      missq: MissQueue.create(),
      seen: new Set(),
      streak: { n: 0 },
      save() { game.save(); },
    };

    return game;
  }

})();

// AudioKit — synthesized Web Audio sound kit for Charlie's Crystal Kingdom.
// All sounds are generated with oscillators, gain envelopes, and a touch of
// filtered noise. No assets, no network. Every public function is wrapped so
// it can never throw — before init, when muted, or when Web Audio is missing
// (e.g. importing this file in Node), every call is a silent no-op.

const AudioKit = (() => {
  // ---- private state (closure-scoped; nothing leaks to top level) ----------
  let akCtx = null;        // AudioContext, created lazily on first init() gesture
  let akMaster = null;     // master GainNode — mute gates this to hard zero
  let akMuted = false;
  let akNoiseBuf = null;   // cached white-noise buffer for the crystal crack

  const AK_MASTER_LEVEL = 0.85;

  function akEnsureContext() {

    if (typeof window === 'undefined') return null;

      akCtx = new AC();

      akMaster.gain.value = akMuted ? 0 : AK_MASTER_LEVEL;
      akMaster.connect(akCtx.destination);

    // so resuming here is safe and idempotent. WebKit can also park a context
    // in a non-standard 'interrupted' state after an app switch, screen lock,
    // or Siri — so resume on ANY non-running state, not just 'suspended'.
    if (akCtx.state !== 'running' && akCtx.resume) {
      const p = akCtx.resume();
      if (p && p.catch) p.catch(() => {});
    }
    return akCtx;
  }

  function akNow() {
    return akCtx ? akCtx.currentTime : 0;
  }

  // end so nothing accumulates across a long session.
  function akTone(opts) {
    if (!akCtx || !akMaster) return;
    const t0 = opts.at;
    const dur = opts.dur;
    const peak = opts.peak !== undefined ? opts.peak : 0.2;
    const attack = opts.attack !== undefined ? opts.attack : 0.012;

    const osc = akCtx.createOscillator();
    const gain = akCtx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(opts.freq, t0);
    if (opts.glideTo) {
      osc.frequency.exponentialRampToValueAtTime(opts.glideTo, t0 + dur);
    }

    // Click-free envelope: linear attack up, exponential release down.
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(gain);
    gain.connect(akMaster);
    osc.onended = () => {
      try {
        osc.disconnect();
        gain.disconnect();
      } catch (e) { /* already gone */ }
    };
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  // Short filtered-noise burst — the sparkle of a crystal crack.
  function akNoise(opts) {
    if (!akCtx || !akMaster) return;
    if (!akNoiseBuf) {
      const len = Math.floor(akCtx.sampleRate * 0.3);
      akNoiseBuf = akCtx.createBuffer(1, len, akCtx.sampleRate);
      const data = akNoiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    const t0 = opts.at;
    const dur = opts.dur;
    const src = akCtx.createBufferSource();
    src.buffer = akNoiseBuf;
    const filt = akCtx.createBiquadFilter();
    filt.type = opts.filterType || 'bandpass';
    filt.frequency.setValueAtTime(opts.freq, t0);
    filt.Q.value = opts.q !== undefined ? opts.q : 6;
    const gain = akCtx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(opts.peak !== undefined ? opts.peak : 0.25, t0 + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filt);
    filt.connect(gain);
    gain.connect(akMaster);
    src.onended = () => {
      try {
        src.disconnect();
        filt.disconnect();
        gain.disconnect();
      } catch (e) { /* already gone */ }
    };
    src.start(t0);
    src.stop(t0 + dur + 0.05);
  }

  // ---- sound palette (C-major-ish, warm and musical) -----------------------
  // Note frequencies used: C3 130.81, E3 164.81, C4 261.63, D4 293.66,
  // E4 329.63, G4 392.0, C5 523.25, D5 587.33, E5 659.26, G5 783.99,
  // A5 880.0, C6 1046.5, E6 1318.5, G6 1568.0

  function akPlayTap() {
    // Soft pop: a tiny rounded blip with a gentle downward glide.
    const t = akNow();
    akTone({ freq: 523.25, glideTo: 392.0, type: 'triangle', at: t, dur: 0.07, peak: 0.12, attack: 0.004 });
  }

  function akPlayPop() {
    // Slightly fuller pop (reveal moment): soft sine drop.
    const t = akNow();
    akTone({ freq: 587.33, glideTo: 293.66, type: 'sine', at: t, dur: 0.13, peak: 0.16, attack: 0.005 });
  }

  function akPlayCorrect() {
    // Ascending major arpeggio, 4 notes, ~180ms each, staggered.
    // Base note varies subtly run-to-run so it never feels canned.
    const bases = [261.63, 293.66, 329.63]; // C4, D4, E4
    const base = bases[Math.floor(Math.random() * bases.length)];
    const ratios = [1, 1.25, 1.5, 2]; // root, major third, fifth, octave
    const t = akNow();
    for (let i = 0; i < ratios.length; i++) {
      akTone({
        freq: base * ratios[i],
        type: 'triangle',
        at: t + i * 0.09,
        dur: 0.18,
        peak: 0.16 + (i === ratios.length - 1 ? 0.04 : 0),
      });
    }
  }

  function akPlayMiss() {
    // Warm, kind low "hmm": E3 then C3, soft sines, never harsh.
    const t = akNow();
    akTone({ freq: 164.81, type: 'sine', at: t, dur: 0.26, peak: 0.14, attack: 0.03 });
    akTone({ freq: 130.81, type: 'sine', at: t + 0.2, dur: 0.34, peak: 0.13, attack: 0.03 });
  }

  function akPlayFanfare() {
    // Land-complete fanfare, ~1.2s: rising arpeggio into a held major chord.
    const t = akNow();
    const run = [261.63, 329.63, 392.0, 523.25]; // C4 E4 G4 C5
    for (let i = 0; i < run.length; i++) {
      akTone({ freq: run[i], type: 'triangle', at: t + i * 0.11, dur: 0.22, peak: 0.16 });
    }
    // Closing chord: C5 + E5 + G5, with a sine octave shimmer on top.
    const chordAt = t + 0.48;
    akTone({ freq: 523.25, type: 'triangle', at: chordAt, dur: 0.72, peak: 0.14, attack: 0.02 });
    akTone({ freq: 659.26, type: 'triangle', at: chordAt, dur: 0.72, peak: 0.12, attack: 0.02 });
    akTone({ freq: 783.99, type: 'triangle', at: chordAt, dur: 0.72, peak: 0.12, attack: 0.02 });
    akTone({ freq: 1046.5, type: 'sine', at: chordAt + 0.05, dur: 0.65, peak: 0.07, attack: 0.04 });
  }

  function akPlayHatch() {
    // Tiny chime: two bright high notes, quick and delicate.
    const t = akNow();
    akTone({ freq: 1318.5, type: 'sine', at: t, dur: 0.16, peak: 0.12, attack: 0.005 });
    akTone({ freq: 1568.0, type: 'sine', at: t + 0.09, dur: 0.24, peak: 0.12, attack: 0.005 });
  }

  function akPlayLevelup() {
    // Bright rising sparkle: quick pentatonic run with a shimmer on top.
    const t = akNow();
    const run = [523.25, 587.33, 659.26, 783.99, 880.0, 1046.5]; // C5 D5 E5 G5 A5 C6
    for (let i = 0; i < run.length; i++) {
      akTone({ freq: run[i], type: 'sine', at: t + i * 0.055, dur: 0.14, peak: 0.11, attack: 0.004 });
    }
    akTone({ freq: 2093.0, type: 'sine', at: t + 0.33, dur: 0.3, peak: 0.06, attack: 0.02 });
  }

  function akPlayBossHit() {
    // Crystalline crack: bright filtered-noise snap plus a glassy ping,
    // both with a very quick decay.
    const t = akNow();
    akNoise({ at: t, dur: 0.12, freq: 4200, q: 5, peak: 0.22 });
    akNoise({ at: t, dur: 0.06, freq: 7800, q: 2, peak: 0.1, filterType: 'highpass' });
    akTone({ freq: 1568.0, glideTo: 1244.5, type: 'sine', at: t + 0.005, dur: 0.14, peak: 0.13, attack: 0.003 });
  }

  const akSounds = {
    tap: akPlayTap,
    correct: akPlayCorrect,
    miss: akPlayMiss,
    fanfare: akPlayFanfare,
    hatch: akPlayHatch,
    levelup: akPlayLevelup,
    pop: akPlayPop,
    bossHit: akPlayBossHit,
  };

  // ---- public API (every function is throw-proof) --------------------------

  return {
    init() {
      // Safe on every gesture: creates the context once, resumes if suspended,
      // and is a silent no-op anywhere Web Audio does not exist.
      try {
        akEnsureContext();
      } catch (e) { /* never throws */ }
    },

    poke() {
      // Resume an EXISTING context only (e.g. on visibilitychange after an
      // interruption). Never creates a context — creation stays gesture-driven.
      try {
        if (akCtx && akCtx.state !== 'running' && akCtx.resume) {
          const p = akCtx.resume();
          if (p && p.catch) p.catch(() => {});
        }
      } catch (e) { /* never throws */ }
    },

    play(name) {
      try {
        if (akMuted) return;               // muted = hard silence
        if (!akCtx || !akMaster) return;   // not initialized yet = silent no-op
        if (akCtx.state !== 'running') return;
        const fn = akSounds[name];
        if (fn) fn();
      } catch (e) { /* never throws */ }
    },

    setMuted(muted) {
      try {
        akMuted = !!muted;
        if (akMaster && akCtx) {
          // Hard-gate the master bus so even in-flight tails go silent fast.
          const t = akCtx.currentTime;
          akMaster.gain.cancelScheduledValues(t);
          akMaster.gain.setValueAtTime(akMaster.gain.value, t);
          akMaster.gain.linearRampToValueAtTime(akMuted ? 0 : AK_MASTER_LEVEL, t + 0.02);
        }
      } catch (e) { /* never throws */ }
    },

    isMuted() {
      try {
        return akMuted;
      } catch (e) {
        return false;
      }
    },
  };
})();

// === src/ui/juice.js ===
// Juice — small delight helpers: toast queue, springy press states, gentle
// shake. DOM access is feature-detected at call time so importing this file
// in Node never crashes; in a browser everything just works.

const Juice = (() => {
  // ---- private state -------------------------------------------------------
  let jzToastQueue = [];
  let jzToastShowing = false;
  let jzToastWrap = null;
  let jzPressified = false; // guard against double-wiring the same document

  const JZ_TOAST_HOLD_MS = 2300;  // how long a toast stays before dismissing
  const JZ_TOAST_EXIT_MS = 320;   // matches the exit transition in juice.css
  const JZ_SHAKE_MS = 460;        // matches the shake keyframes duration
  const JZ_DIM_MS = 360;          // matches the dim keyframes duration

  function jzHasDom() {
    return typeof window !== 'undefined' && typeof document !== 'undefined';
  }

  function jzReducedMotion() {
    try {
      if (!jzHasDom() || typeof window.matchMedia !== 'function') return false;
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) {
      return false;
    }
  }

  // ---- toast queue ---------------------------------------------------------

  function jzEnsureToastWrap() {
    if (jzToastWrap && jzToastWrap.isConnected) return jzToastWrap;
    jzToastWrap = document.createElement('div');
    jzToastWrap.className = 'jz-toast-wrap';
    jzToastWrap.setAttribute('aria-live', 'polite');
    document.body.appendChild(jzToastWrap);
    return jzToastWrap;
  }

  function jzShowNextToast() {
    if (jzToastShowing) return;
    const next = jzToastQueue.shift();
    if (next === undefined) return;
    jzToastShowing = true;

    const wrap = jzEnsureToastWrap();
    const el = document.createElement('div');
    el.className = 'jz-toast';
    el.textContent = next.text;
    wrap.appendChild(el);

    // Force a layout so the entrance animation always plays from the start.
    void el.offsetWidth;
    el.classList.add('jz-toast-in');

    window.setTimeout(() => {
      el.classList.remove('jz-toast-in');
      el.classList.add('jz-toast-out');
      window.setTimeout(() => {
        if (el.parentNode) el.parentNode.removeChild(el);
        jzToastShowing = false;
        jzShowNextToast();
      }, JZ_TOAST_EXIT_MS);
    }, next.hold);
  }

  // ---- delegated press states ---------------------------------------------

  function jzWirePress(rootEl) {
    let pressedEl = null;

    const release = () => {
      if (pressedEl) {
        pressedEl.classList.remove('is-pressed');
        pressedEl = null;
      }
    };

    rootEl.addEventListener('pointerdown', (e) => {
      try {
        const target = e.target && e.target.closest ? e.target.closest('[data-press]') : null;
        release();
        if (target) {
          pressedEl = target;
          target.classList.add('is-pressed');
        }
      } catch (err) { /* never break input handling */ }
    }, { passive: true });

    rootEl.addEventListener('pointerup', release, { passive: true });
    rootEl.addEventListener('pointercancel', release, { passive: true });
    rootEl.addEventListener('pointerleave', release, { passive: true });
  }

  // ---- public API ----------------------------------------------------------

  return {
    // Top toast with spring entrance; queued so messages never overlap.
    // Optional holdMs overrides how long this toast stays on screen.
    toast(text, holdMs) {
      try {
        if (!jzHasDom() || !text) return;
        const hold = holdMs > 0 ? Number(holdMs) : JZ_TOAST_HOLD_MS;
        jzToastQueue.push({ text: String(text), hold });
        jzShowNextToast();
      } catch (e) { /* never throws */ }
    },

    // Delegated springy press states for everything marked [data-press].
    // One set of listeners on the root — no per-element wiring.
    pressify(rootEl) {
      try {
        if (!jzHasDom()) return;
        const root = rootEl || document.body;
        if (!root || !root.addEventListener) return;
        if (root === document.body && jzPressified) return;
        if (root === document.body) jzPressified = true;
        jzWirePress(root);
      } catch (e) { /* never throws */ }
    },

    // Gentle horizontal shake for a retry moment. With reduced motion
    // preferred, a brief dim takes its place — no movement at all.
    shake(el) {
      try {
        if (!jzHasDom() || !el || !el.classList) return;
        if (jzReducedMotion()) {
          el.classList.remove('jz-dim');
          void el.offsetWidth;
          el.classList.add('jz-dim');
          window.setTimeout(() => el.classList.remove('jz-dim'), JZ_DIM_MS);
        } else {
          el.classList.remove('jz-shake');
          void el.offsetWidth;
          el.classList.add('jz-shake');
          window.setTimeout(() => el.classList.remove('jz-shake'), JZ_SHAKE_MS);
        }
      } catch (e) { /* never throws */ }
    },

    reducedMotion() {
      return jzReducedMotion();
    },
  };
})();

// === src/ui/particles.js ===
// Particles — canvas overlay particle system for Charlie's Crystal Kingdom.
// Contract: attach(canvas), burst(kind, x, y, opts), sparkleTrail(x, y),
// setReduced(bool), tick(dt), count(). Hard cap 300 live particles.
// One rAF loop lives in main.js and calls Particles.tick(dt) with dt in seconds.

const Particles = (() => {
  const MAX = 300;
  const live = [];
  let cvs = null;
  let ctx = null;
  let reduced = false;
  let cssW = 0;
  let cssH = 0;

  const COLORS = {
    shatter: ['#7ef0e2', '#b9a7ff', '#f4f1ff', '#5eead4', '#c4b5fd'],
    confetti: ['#ffd166', '#ff8e7a', '#2dd4bf', '#a78bfa', '#f7f5ff', '#7ef0e2', '#f0abfc'],
    hatch: ['#ffd166', '#ffe9a8', '#f7f5ff', '#ffc94d'],
    sparkle: ['#ffd166', '#f7f5ff', '#c4b5fd', '#7ef0e2'],
  };

  function pick(arr) {
    return arr[(Math.random() * arr.length) | 0];
  }

  function resize() {
    if (!cvs) return;
    const dpr = Math.min((typeof window !== 'undefined' && window.devicePixelRatio) || 1, 2);
    cssW = window.innerWidth;
    cssH = window.innerHeight;
    cvs.width = Math.max(1, Math.round(cssW * dpr));
    cvs.height = Math.max(1, Math.round(cssH * dpr));
    cvs.style.width = cssW + 'px';
    cvs.style.height = cssH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function attach(canvas) {
    cvs = canvas;
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
  }

  // Cap enforcement: new spawns evict the oldest live particles.
  function push(p) {
    if (live.length >= MAX) live.splice(0, live.length - MAX + 1);
    live.push(p);
  }

  function spawnOne(kind, x, y) {
    const a = Math.random() * Math.PI * 2;
    if (kind === 'shatter') {
      const sp = 130 + Math.random() * 250;
      push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 130,
        g: 640,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 12,
        size: 4 + Math.random() * 7,
        life: 0.7 + Math.random() * 0.5,
        age: 0,
        color: pick(COLORS.shatter),
        shape: 'shard',
      });
    } else if (kind === 'confetti') {
      const sp = 220 + Math.random() * 320;
      const up = -Math.PI / 2 + (Math.random() - 0.5) * 1.3;
      push({
        kind, x, y,
        vx: Math.cos(up) * sp,
        vy: Math.sin(up) * sp,
        g: 460,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 16,
        size: 5 + Math.random() * 6,
        life: 1.4 + Math.random() * 1.1,
        age: 0,
        wob: Math.random() * Math.PI * 2,
        color: pick(COLORS.confetti),
        shape: 'rect',
      });
    } else if (kind === 'hatch') {
      const sp = 90 + Math.random() * 200;
      push({
        kind, x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 170,
        g: 380,
        rot: 0,
        vr: 0,
        size: 3 + Math.random() * 5,
        life: 0.8 + Math.random() * 0.6,
        age: 0,
        color: pick(COLORS.hatch),
        shape: Math.random() < 0.5 ? 'star' : 'dot',
      });
    } else {
      // sparkle
      const sp = 30 + Math.random() * 90;
      push({
        kind: 'sparkle', x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 30,
        g: 60,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 4,
        size: 2.5 + Math.random() * 4,
        life: 0.5 + Math.random() * 0.5,
        age: 0,
        color: pick(COLORS.sparkle),
        shape: 'star',
      });
    }
  }

  const DEFAULT_COUNT = { shatter: 26, confetti: 60, hatch: 30, sparkle: 12 };

  function burst(kind, x, y, opts) {
    if (reduced || !ctx) return;
    const n = (opts && opts.count) || DEFAULT_COUNT[kind] || 12;
    for (let i = 0; i < n; i++) spawnOne(kind, x, y);
  }

  function sparkleTrail(x, y) {
    if (reduced || !ctx) return;
    for (let i = 0; i < 2; i++) spawnOne('sparkle', x + (Math.random() - 0.5) * 12, y + (Math.random() - 0.5) * 12);
  }

  function setReduced(b) {
    reduced = !!b;
    if (reduced) {
      live.length = 0;
      if (ctx) ctx.clearRect(0, 0, cssW, cssH);
    }
  }

  function drawStar(p, alpha) {
    const s = p.size;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    // four-point twinkle
    ctx.moveTo(0, -s);
    ctx.quadraticCurveTo(s * 0.22, -s * 0.22, s, 0);
    ctx.quadraticCurveTo(s * 0.22, s * 0.22, 0, s);
    ctx.quadraticCurveTo(-s * 0.22, s * 0.22, -s, 0);
    ctx.quadraticCurveTo(-s * 0.22, -s * 0.22, 0, -s);
    ctx.fill();
    ctx.restore();
  }

  function tick(dt) {
    if (!ctx) return;
    ctx.clearRect(0, 0, cssW, cssH);
    if (!live.length || !dt) {
      // still clear so stale frames never linger after setReduced(true)
      if (!live.length) return;
    }
    for (let i = live.length - 1; i >= 0; i--) {
      const p = live[i];
      p.age += dt;
      if (p.age >= p.life || p.y > cssH + 80) {
        live.splice(i, 1);
        continue;
      }
      p.vy += p.g * dt;
      if (p.shape === 'rect') {
        p.wob += dt * 6;
        p.x += (p.vx + Math.sin(p.wob) * 60) * dt;
      } else {
        p.x += p.vx * dt;
      }
      p.y += p.vy * dt;
      p.rot += p.vr * dt;

      const t = p.age / p.life;
      const alpha = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
      if (p.shape === 'shard') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = alpha * 0.95;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.lineTo(p.size * 0.7, p.size * 0.6);
        ctx.lineTo(-p.size * 0.7, p.size * 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = alpha * 0.35;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else if (p.shape === 'rect') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size * 0.35, p.size, p.size * 0.7);
        ctx.restore();
      } else if (p.shape === 'star') {
        drawStar(p, alpha);
      } else {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    ctx.globalAlpha = 1;
  }

  function count() {
    return live.length;
  }

  return { attach, burst, sparkleTrail, setReduced, tick, count };
})();

// plus the Crystal Castle on a winding path. Per-land palettes, CSS idle
// animations, locked = desaturated + crystal lock, completed = glow.
// Sky = multi-stop gradient that warms with completion count (CSS background,
// because SVG paint-server references are not allowed by the build rules).
// API: WorldMap.render(container, view, onSelectLand)
//   view = { lands: [{id, name, unlocked, stars}], completedCount, highlight }

const WorldMap = (() => {
  // sky palettes from cold twilight (0 lands freed) to warm aurora dawn (6)

    grove:      { x: 140, y: 468 },
    lagoon:     { x: 352, y: 540 },
    cliffs:     { x: 548, y: 446 },

  };

  function starPts(cx, cy, r) {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 === 0 ? r : r * 0.45;
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      pts.push((cx + Math.cos(a) * rad).toFixed(1) + ',' + (cy + Math.sin(a) * rad).toFixed(1));
    }
    return pts.join(' ');
  }

    const hw = w / 2;

      '<path d="M' + -hw * 0.92 + ' 6 L' + -hw * 0.5 + ' ' + hw * 0.75 + ' L0 ' + hw * 0.95 +
      ' L' + hw * 0.55 + ' ' + hw * 0.7 + ' L' + hw * 0.92 + ' 6 Q0 ' + hw * 0.42 + ' ' + -hw * 0.92 + ' 6 Z" fill="' + side + '"/>' +

  // ---- world 2 scenes ----

    s += '<path class="wm-wave" d="M-46 -22 Q-32 -30 -18 -22 Q-4 -14 10 -22 Q24 -30 38 -22" fill="none" stroke="#d8f4ff" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>';
    s += '<path class="wm-wave w2" d="M-38 -38 Q-26 -45 -14 -38 Q-2 -31 10 -38 Q22 -45 34 -38" fill="none" stroke="#d8f4ff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>';
    s += '<ellipse cx="-26" cy="-6" rx="11" ry="4.5" fill="#3fae8c"/>';
